l_english:
  wwi_austria.1.t:0 "The Assassination of Franz Ferdinand"
  wwi_austria.1.d:0 "Franz Ferdinand, heir to the throne of Austria-Hungary, is dead.\n\nIt was an otherwise tranquil day in Sarajevo when, during his state visit to the recently annexed territory of Bosnia-Herzegovina, the Archduke narrowly escaped a bomb thrown into the route of their motorcade. Despite this attempt on his life, Franz opted to continue his tour through the Bosnian city, only to be shot on his return from the town hall by an undetected agent. He and his wife, also victim to the incident, leave three orphaned children.\n\nAs the empire settles into mourning, many in the Austrian government set their glare on Serbia - presumed, by some, to be directly implicated in the murder, which was carried out by members of the mysterious Serb-nationalist Black Hand group. It remains to be seen how the Monarchy will respond to what is only the latest and most audacious of Balkan crises."
  wwi_austria.1.a:0 "Send an ultimatum! Either the Serbs cooperate, or we march on Belgrade!"
  wwi_austria.1.b:0 "Despite such a tragedy we must maintain our patience with the Serbs ..."
  wwi_austria.2.t:0 "Archduke's Visit to Sarajevo a Success"
  wwi_austria.2.d:0 "Considering the crowds of jubilant Bosnians, it would seem that the royal visit to Bosnia-Herzegovina by Archduke Franz Ferdinand - heir to the Austro-Hungarian throne - could only be called a rousing success. The Archduke and his wife toured the recently annexed territory following renewed attempts to earn the loyalty of their south-slav subjects, amid ongoing talk of reform to the multi-ethnic empire.\n\nDespite moderate warnings of a potential terrorist attack in the region - long coveted by Serb nationalists as a gemstone of south-slav unity - the Archduke's visit proceeded in safety and comfort. He and his Duchess were particularly flattered by the territory's vibrant bazaars and hospitable locals."
  wwi_austria.2.a:0 "Perhaps Bosnia has a prosperous future in the empire after all."
  wwi_austria.3.t:0 "Serbia Rejects our Ultimatum"
  wwi_austria.3.d:0 "In keeping with their tradition of diplomatic intransigence, the Serbian government has rejected our calls for judicial collaboration and an end to Serb expansionism. Grim as this eventuality may be, we made the alternative quite clear to [SER.GetLeader]."
  wwi_austria.3.a:0 "War it is."
  wwi_austria.4.t:0 "Serbia Accepts our Ultimatum"
  wwi_austria.4.d:0 "Despite the assumptions of the Austrian foreign office, the Serbian government, it seems, has come to its senses. We recieved word this morning that [SER.GetLeader]'s administration is willing to give us free reign of investigations into the murder of our beloved Archduke and - more importantly - will revoke claims over our rightful Bosnian holdings. Justice may yet be served to the perpetrators of this brutality. For now, at least, war is no longer a necessity."
  wwi_austria.4.a:0 "Oh, umm ... splendid."

  wwi_serbia.1.t:0 "Austro-Hungarian Ultimatum"
  wwi_serbia.1.d:0 "In the wake of the assassination of Archduke Franz Ferdinand by pro-Serb elements, Vienna has offered our foreign office a grave set of demands. The ultimatum insists upon Austrian control of our judicial process, the removal of Serbian officials implicated with the incident, and the cessation of all posturings from Belgrade on Austrian-controlled Serbdom.\n\nNaturally, accepting such conditions would amount to a forfeit of Serbian sovreignty. The Austrians have been quite clear, however, that the only alternative is war."
  wwi_serbia.1.a:0 "An unmeetable set of demands! We knew nothing of this plot!"
  wwi_serbia.1.b:0 "We cannot withstand the might of Austria-Hungary ..."
  wwi_serbia.2.t:0 "[From.GetName] Joins Our League"
  wwi_serbia.2.d:0 "[From.GetName] has agreed to enter our defensive pact. What could stand in our way now?"
  wwi_serbia.2.a:0 "We knew they'd come around."
  wwi_serbia.3.t:0 "[From.GetName] Accepts Our Deal to Join The Balkan League"
  wwi_serbia.3.d:0 "Longstanding the contention over our rightful Macedonian territory with [From.GetName] may be, it appears that [From.GetAdjective] has found it in themselves to meet us half way. [From.GetName] agrees that if mediation is required over the spoils of a balkan war, it shall be carried out by [SOV].GetNameDef. No doubt the [From.GetAdjective] ministry expects they'll be favoured."
  wwi_serbia.3.a:0 "We'll see about that."
  wwi_serbia.4.t:0 "[From.GetName] Accepts Our Deal to Join The Balkan League"
  wwi_serbia.4.d:0 "Longstanding the contention over our rightful Macedonian territory with [From.GetName] may be, it appears that [From.GetAdjective] has found it in themselves to meet us half way. [From.GetName] agrees that if mediation is required over the spoils of a balkan war, it shall be carried out by [AUS].GetNameDef. No doubt the [From.GetAdjective] ministry expects they'll be favoured."
  wwi_serbia.4.a:0 "We'll see about that."
  wwi_serbia.5.t:0 "[From.GetName] Refuses Ultimatum"
  wwi_serbia.5.d:0 "[From.GetName], ever insolent, has averted all hope of peace in refusing to recognise Macedonia as a solely [Root.GetAdjective] territory. The consequence of such a rejection was made quite apparent in our ultimatum.
  wwi_serbia.5.a:0 "[From.GetName] will abandon their claims one way or another!"
  wwi_serbia.6.t:0 "[From.GetName] Accepts Ultimatum"
  wwi_serbia.6.d:0 "For all their tough talk, diplomats in [From.Capital.GetName] have proven yellow-bellied indeed after caving to our demands that they relinquish claims on Macedonia. The region is now ours to take: Bulgarian Macedonians won't see a shred of support from their mother state."
  wwi_serbia.6.a:0 "Rightfully so."
  wwi_serbia.7.t:0 "[From.GetName] Asks to Join the Balkan League"
  wwi_serbia.7.d:0 "[From.GetName] has requested to join our military alliance, no doubt hoping to claim some portion of our inevitable conquests as their own. The [From.GetAdjective] is hardly impressive; their navy, on the other hand ..."
  wwi_serbia.7.d_bulgaria:0 "[From.GetName] has requested to join our military alliance, no doubt hoping to claim some portion of our inevitable conquests as their own. This is in spite of [BUL.GetName] already holding a spot within the League; [BUL.GetName] and [GRE.GetName] have overlapping interests in Salonika. Still, that's hardly a concern of ours ..."
  wwi_serbia.7.a:0 "So long as they promise to play nice."
  wwi_serbia.7.b:0 "We have little need of [From.GetAdjective] support."

  wwi_montenegro.1.t:0 "Serbia Invites Us to Join the Balkan League"
  wwi_montenegro.1.d:0 "Long have we coveted the Turkish lands on our borders, but our small kingdom could never stand up to the Ottoman Empire, even in its decline.\n\nNow, however, it seems that Serbia wants to make us an offer: they will support our claims, if we join them in the coming wars.\n\nThe Serbs are old friends of ours, but the Turks are not to be underestimated. How should we respond?"
  wwi_montenegro.1.a:0 "How could we say no?"
  wwi_montenegro.1.b:0 "[Root.GetName] must stay out of trouble, for now."

  wwi_bulgaria.1.t:0 "[From.GetName] Proposes a Deal, Invites Us to the Balkan League"
  wwi_bulgaria.1.d:0 "[From.GetName] has been an insolent rival of ours in Macedonia - clearly [Root.GetAdjective] territory - for quite some time. Yet a telegraph from [From.Capital.GetName] today suggests that we put our scrapping aside to take on yet greater perils in the Balkans. Any disputes over the spoils of conquest, [From.GetName] insists, can be arbitrated by [SOV.GetNameDef].\n\nWhat are we to make of their offer? Should we join this 'Balkan League'?"
  wwi_bulgaria.1.a:0 "The Serbs would make valuable allies, we suppose ..."
  wwi_bulgaria.1.b:0 "Macedonia is not up for negotiation."
  wwi_bulgaria.2.t:0 "[From.GetName] Proposes a Deal, Invites Us to the Balkan League"
  wwi_bulgaria.2.d:0 "[From.GetName] has been an insolent rival of ours in Macedonia - clearly [Root.GetAdjective] territory - for quite some time. Yet a telegraph from [From.Capital.GetName] today suggests that we put our scrapping aside to take on yet greater perils in the Balkans. Any disputes over the spoils of conquest, [From.GetName] insists, can be arbitrated by [AUS.GetNameDef].\n\nWhat are we to make of their offer? Should we join this 'Balkan League'?"
  wwi_bulgaria.2.a:0 "The Serbs would make valuable allies, we suppose ..."
  wwi_bulgaria.2.b:0 "Macedonia is not up for negotiation."
  wwi_bulgaria.3.t:0 "[From.GetName] Demands an End to Bulgarian Posturing in Macedonia"
  wwi_bulgaria.3.d:0 "[From.Adjective] meddling in our nation's rightful hinterland, Macedonia, has finally come to a head: the treacherous [From.Adjective] ministers have concocted an ultimatum. We are to withdraw all claims in the Macedonian region, or face war with [From.GetName].\n\nInsolent as the [From.GetAdjective] leadership is, their armies are not to be underestimated. That said, we certainly gave them a beating back in 1885. Why shouldn't we do it again?"
  wwi_bulgaria.3.a:0 "Look who's come back for more."
  wwi_bulgaria.3.b:0 "Macedonia is hardly worth warring over ..."

  wwi_romania.1.t:0 "Serbia Offers Territory in Exchange for Mutual Assurances"
  wwi_romania.1.d:0 "Our Balkan co-inhabitants to the west have come to the [Root.GetAdjective] foreign office, this morning, with a proposal: join their little 'Balkan League', and we'll be granted the province of Branicevo - home to a large Romanian-speaking minority.\n\nSuch an offer hardly caters to the concerns centre-stage of [Root.GetAdjective] posturing, but perhaps an alliance with [From.GetName] would serve us well in our fight against greater foes ..."
  wwi_romania.1.a:0 "We'll take it!"
  wwi_romania.1.b:0 "An ill-advised entanglement."

  wwi_greece.1.t:0 "Britain Encourages Greece to Join Balkan League"
  wwi_greece.1.d:0 "The British - historic partners of ours - have nonetheless always maintained a conservative stance on the recession of Turkish influence. Until recently, that is. This morning, a telegram from London arrived detailing British approval - insistence, really - of Greek entry into a military alliance with Serbia. Such an alliance would surely aid in our reclamaition of Greek territory, if we could only earn Serbian approval. Britain, in addition, has promised political support in exchange for our compliance."
  wwi_greece.1.a:0 "Thessaloniki shall be ours again!"
  wwi_greece.1.b:0 "Throw our lot in with the Serbs? Perhaps not."

  wwi_news.1.t:0 "[TUR.GetNameDef] Humiliated in Italo-[TUR.GetAdjective] War"
  wwi_news.1.d:0 "When war broke out between [ITA.GetNameDef] and the long-attested Sick Man of Europe, there was little wonder of who would emerge victorious. Still, Italy's consistent beating back of its mediterranean foe has left even the most speculative pundits stunned at the military weakness of the ageing empire. Now, as [ITA.GetNameDef] gathers up its winnings, it must be supposed that other [TUR.GetAdjective] neighbors might soon follow the [ITA.GetADjective] example."
  wwi_news.1.a_turkish_ally:0 "A troubling challenge to our interests."
  wwi_news.1.a_neutral:0 "[TUR.GetNameDef] is surely on its last legs."
  wwi_news.1.a_turkish_enemy:0 "This could be our chance!"