l_english:
  event_AUS_reform.1.t: "[FROM.GetOldNameDefCap] Reforms"
  event_AUS_reform.1.d: "The Austro-Hungarian Empire, subject for decades to diplomatic ridicule and murmurings of an anachronistic state, set about reforming itself into a lasting polity in recent years.\n\nDespite the doubts of many, the fruition of these efforts was proclaimed today by [FROM.GetLeader]: Austria-Hungary is no more, [FROM.GetNameDef] takes its place.\n\nThe newly federalised state promises equality, enfranchisement, and freedom of language to all its peoples, to the chagrin of formerly privileged [HUN.GetAdjectiveCap] politicians and German-[FROM.GetOldAdjectiveCap] nationalists.\n\n[FROM.GetOldName] survives into modernity. But will it withstand the mounting crises of Europe?"
  event_AUS_reform.1.a: "We are united."
  event_AUS_reform.1.b: "Who could have supposed?"
  event_AUS_reform.1.c: "A fancy new name will not save them."
  event_AUS_reform.1.d: "This was not what our forefathers died for."

  event_AUS_reform.2.t: "[SCS.GetNameDefCap]"
  event_AUS_reform.3.t: "[GLD.GetNameDefCap]"
  event_AUS_reform.trialist_reform_d: "Many decades of conniving have been spent clearing the obstacles towards trialist reform: the dream of Ferdinand, and of his friends and foes alike.\n\nA third kingdom under the monarchy will ignite the allegiances of our many minorities and, more importantly, break the monopoly of power held by [HUN.GetNameDef] since 1867.\n\nA third voice sounds out across the empire."
  event_AUS_reform.trialist_reform_a: "At last."

  event_AUS_reform.4.t: "[From.GetNameDefCap] Proposes Territorial Ammendment"
  event_AUS_reform.4.d: "Statesmen in [FROM.Capital.GetCapitalVictoryPointName] have tabled an ammendment to the territory of our newly created crownland.\n\nThey offer us newly conquered [SER.GetAdjective] and [MNT.GetAdjective] lands. In exchange, we will return [174.GetName] and [214.GetName].\n\nThough an unorthodox request, few in [THIS.Capital.GetCapitalVictoryPointName] believe we have the power to decline it."
  event_AUS_reform.4.a: "Very well."

  event_AUS_reform.5.t: "[FROM.GetNameDefCap] Accepts Territorial Ammendment"
  event_AUS_reform.5.d: "[FROM.GetNameDefCap] has agreed to return [174.GetName] and [214.GetName] to our control, in exchange for [SER.GetAdjective] and [MNT.GetAdjective] lands.\n\nWith this arrangement, [THIS.GetAdjective] access to the sea remains secure."
  event_AUS_reform.5.a: "Excellent."

  event_AUS_reform.6.t_croatia: "[FROM.GetNameDefCap] Offers Territory for Croatia"
  event_AUS_reform.6.t_transylvania: "[FROM.GetNameDefCap] Offers Territory for Southern Transylvania"
  event_AUS_reform.6.d_base_croatia: "Diplomats of [FROM.GetNameDef] have proposed an exchange of territories: they demand Croatia, coveted by [FROM.Capital.GetCapitalVictoryPointName] for its significance in the formation of a third south-slav Crownland.\n\nIn exchange we will receive"
  event_AUS_reform.6.d_base_transylvania: "Diplomats of [FROM.GetNameDef] have proposed an exchange of territories: they demand southern Transylvania - perhaps intending its pawning off for diplomatic support in Europe.\n\nIn exchange we will receive"
  event_AUS_reform.6.d_croatia_serbia: "$event_AUS_reform.5.d_base_croatia$ Serbia."
  event_AUS_reform.6.d_croatia_wallachia: "$event_AUS_reform.5.d_base_croatia$ Wallachia, the southern portion of Romania."
  event_AUS_reform.6.d_croatia_moldovia: "$event_AUS_reform.5.d_base_croatia$ Moldovia, the northern portion of Romania."
  event_AUS_reform.6.d_croatia_ruthenia: "$event_AUS_reform.5.d_base_croatia$ Ruthenia, the western portion of Ukraine."
  event_AUS_reform.6.d_croatia_poland: "$event_AUS_reform.5.d_base_croatia$ the southern portion of Poland."
  event_AUS_reform.6.d_transylvania_serbia: "$event_AUS_reform.5.d_base_transylvania$ Serbia."
  event_AUS_reform.6.d_transylvania_wallachia: "$event_AUS_reform.5.d_base_transylvania$ Wallachia, the southern portion of Romania."
  event_AUS_reform.6.d_transylvania_moldovia: "$event_AUS_reform.5.d_base_transylvania$ Moldovia, the northern portion of Romania."
  event_AUS_reform.6.d_transylvania_ruthenia: "$event_AUS_reform.5.d_base_transylvania$ Ruthenia, the western portion of Ukraine."
  event_AUS_reform.6.d_transylvania_poland: "$event_AUS_reform.5.d_base_transylvania$ the southern portion of Poland."
  event_AUS_reform.6.a: "Very well."

  event_AUS_reform.7.t_croatia: "The Austro-Hungarian-Croatian Empire"
  event_AUS_reform.7.t_poland: "The Austro-Hungarian-Galician Empire"
  event_AUS_reform.7.d_base: "The ageing Austro-Hungarian empire announced, this morning, its transformation into a Trialist state with the proclamation of a new kingdom to accompany [AUS.GetNameDef] and [HUN.GetNameDef].\n\n"
  event_AUS_reform.7.d_end: "The reform, long resisted by the [HUN.GetAdjective] government, is hoped to bring an end to the empire's ethnic troubles and political gridlock."
  event_AUS_reform.7.d_croatia: "$event_AUS_reform.7.d_base$[SCS.GetNameDefCap] joins her sister territories on the danube, economically independent but diplomatically represented by [AUS.Capital.GetCapitalVictoryPointName].\n\n$event_AUS_reform.7.d_end$"
  event_AUS_reform.7.d_poland: "$event_AUS_reform.7.d_base$[GLD.GetNameDefCap] enjoys new liberties and a greater share of [POL.GetOldAdjectiveCap] lands, but remains a subject of [AUS.Capital.GetCapitalVictoryPointName].\n\n$event_AUS_reform.7.d_end$"
  event_AUS_reform.7.a: "Long overdue."
  event_AUS_reform.7.b: "We shall see what this means for [THIS.GetNameDef]."
  event_AUS_reform.7.c: "Our salutations to the new kingdom."
  event_AUS_reform.7.d: "This will not save the dying monarchy."

  event_AUS_reform.8.t: "[AUS.GetNameDefCap] offers [236.Getname] for Economic Concessions"
  event_AUS_reform.8.d: "[AUS.GetNameDefCap] has offered us the territory of [236.Getname] in exchange for favourable trading terms."
  event_AUS_reform.8.a: "Certainly."
  event_AUS_reform.8.b: "We are not interested."

  event_AUS_reform.9.t: "[AUS.GetNameDefCap] Seizes [seized_territory.GetName]"
  event_AUS_reform.9.d: "Claiming to be acting in defense of local German communities, [FROM.GetNameDef] has forcibly confiscated [seized_territory.GetName] and its surrounding territories.\n\nThis is an abject violation of the 1867 Compromise, as well as a threat to our national security. However, with [AUS.Capital.GetCapitalVictoryPointName] dominating the empire's political landscape, it seems we're powerless to stop them."
  event_AUS_reform.9.a: "This will not stand."

  event_AUS_reform.10.t: "The Dismantling of [THIS.GetNameDef]"
  event_AUS_reform.10.d: "To the furious jeers of ministers in the [THIS.capital.GetCapitalVictoryPointName] National Assembly, [THIS.GetLeader] recites the legislation from [FROM.capital.GetCapitalVictoryPointName]. 'Self-Governing Bodies of the Lands of Saint Stephen are to be dissolved and re-constituted in the Empire's singular capital. The laws of [HUN.GetOldNameDef] are to be the laws of [AUS.GetOldNameDef].'\n\n[AUS.GetAdjectiveCap] pre-eminence over the dual monarchy has enveloped our homeland in recent years, to the disbelief of the [HUN.GetAdjective] elite. Now, a shadow of her former self, [HUN.GetNameDef] is in no position to resist this final affront."
  event_AUS_reform.10.a: "This is not what our forefathers died for."

  event_AUS_reform.11.t: "Plebiscite Grants [seized_territory.GetName] to [FROM.GetNameDef]"
  event_AUS_reform.11.d: "A pebiscite which the [THIS.GetAdjective] National Assembly considers to be illegal was conducted among [seized_territory.GetName] citizens - [HUN.GetOldADjectiveCap] or otherwise - by [FROM.GetAdjectiveCap] authorities. [FROM.GetNameDefCap] promises the territory's electorate a fairer future under the rule of [FROM.capital.GetCapitalVictoryPointName].\n\nThis gross violation of the 1867 Compromise, and of [HUN.GetOldAdjective] autonomy, has enraged the [THIS.capital.GetCapitalVictoryPointName] leadership, but vulnerable as we are to [FROM.GetAdjective] impositions. there is little that can be done."
  event_AUS_reform.11.a: "This will not stand."

  event_AUS_reform.12.t: "A United [FROM.GetName]"
  event_AUS_reform.12.d: "Wounds were opened across [THIS.GetOldName] in 1848 which many, on either side of the Danube, assumed would never heal. But the crises of the 20th century have brought about a tenacity in the [FROM.GetOldAdjective] elite: [FROM.GetOldNameDef] has reestablished its grasp of [THIS.capital.GetCapitalVictoryPointName] and, despite the hopes of some, [THIS.GetOldNameDef] has no appetite to resist.\n\nThough the National Assembly will remain, many of its former ministers today travel upriver to the [FROM.GetAdjective] parliament, from which the two halves of the Empire will be ruled as states of a federation.\n\nOur brief gasp of sovreignty comes to an end."
  event_AUS_reform.12.a: "This is not what our forefathers died for."

  event_AUS_reform.13.t: "[FROM.GetNameDefCap] Unites"
  event_AUS_reform.13.d: "The ageing Austro-Hungarian empire announced, this morning, long-awaited reform to its until now dualist statehood.\n\n[HUN.GetNameDefCap], until now only loosely unified with [FROM.GetOldNameDef], has agreed to govern directly from [FROM.capital.GetCapitalVictoryPointName] as a federal partner of its western neighbor - a move opposed by the [HUN.GetOldAdjectiveCap] National Assembly for many decades.\n\nThough [FROM.GetOldNameDef]'s political stalement with its Crownland may have ended, national equality for all within the Empire's borders remains a distant dream. Despite this, the patchwork of nations on the danube appears poised to continue its trundle into modernity, whole."
  event_AUS_reform.13.a: "Long overdue."
  event_AUS_reform.13.b: "Our salutations to the new parliament."
  event_AUS_reform.13.c: "This will not save the dying monarchy."
  
  event_AUS_reform.14.t: "[FROM.GetNameDefCap] is Proclaimed"
  event_AUS_reform.14.d: "The ageing Austro-Hungarian empire announced, this morning, a dramatic change in its political order.\n\nCiting misgivings over the treatment of Austrian-Germans within [HUN.GetOldAdjectiveCap] borders, [FROM.capital.GetCapitalVictoryPointName] has reestablished the absolute rule over the Lands of Saint Stephen not seen since the Augsleich was signed.\n\n[HUN.GetNameDefCap], an obstacle to the empire's internal affairs since its abortive revolution in 1848, has seen its grip on the dualist state slacken in recent years. Nonetheless, the proclamation comes as a shock to diplomatic circles."
  event_AUS_reform.14.a: "Long overdue."
  event_AUS_reform.14.b: "Welcome news."
  event_AUS_reform.14.c: "[HUN.GetOldNameDefCap] should never have signed the Augsleich."
  event_AUS_reform.14.d: "This will not save the dying monarchy."