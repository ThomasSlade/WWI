l_english:
  event_SOV_generic.1.t: "Pyotr Stolypin Assassinated"
  event_SOV_generic.1.d: "Following his disruptive land reforms that antagonised [THIS.GetOldAdjective] squires and socialists alike, [THIS.SOV_pyotr_stolypin.GetName] has been shot dead at the [THIS.GetOwnedRussianCityForStolypinAssassination] Opera.\n\nThough the shooter has been confirmed a leftist, [THIS.capital.GetCapitalVictoryPointName]'s interferance in the investigation has raised suspicions that Stolypin's efforts fell foul of the landed class.\n\nA Tsarist to the end, Stolypin's last act was to sign the cross to [THIS.GetLeader]."
  event_SOV_generic.1.a: "[SOV.GetNameDefCap] was not ready."
  event_SOV_generic.2.t: "The Western Zemstvo Bill"
  event_SOV_generic.2.d: "\"Twenty years to save Russia is what I need.\"\n\nSo says the tenacious [THIS.GetAdjective] statesman, [THIS.SOV_pyotr_stolypin.GetName], whose efforts in abolishing the village commune aim to engineer a rural class of smallholders, loyal - at last - to the regime.\n\n[THIS.SOV_pyotr_stolypin.GetName]'s bid to trial this reform policy in the Polish borderlands has met fierce resistance in the Duma. It has taken the minister's threat of resignation to secure the bill - alienating even [THIS.GetLeaderTitle] [THIS.GetLeader] in the process."
  event_SOV_generic.2.a: "We can no longer guarantee Stolypin's safety."
  event_SOV_generic.2.b: "Only Stolypin can save the [THIS.GetRegimeName]."