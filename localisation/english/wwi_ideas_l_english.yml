  territory_restored: "Territory Restored"
  territory_restored_desc: "Securing claimed territory has earned you the confidence in financiers and the pride of your citizens."
  foreign_investment: "Foreign Investment"
  foreign_investment_desc: "Stock-brokers the world over clamour to invest in your nation."
  agricultural_exports: "Agricultural Exports"
  agricultural_exports_desc: "The fields and mines of your hinterland secure a splendid profit overseas. Extracting and exporting these goods becomes paramount."
  expansionist_withers: "Expansionism Withers"
  expansionist_withers_desc: "The chest-beating of revaunchists and irredentists falls on deaf ears in your capital: your people find themselves defending the status quo."
  rail_loans: "Railway Loans"
  rail_loans_desc: "Seeing the great potential of [ROOT.GetDefName], tycoons and capitalists readily shell` money into your railways."
  mountain_training_tt: "£unit_infantry_icon_small£Infantry and £unit_artillery_brigade_icon_small£Artillery:\n §YMountains§!:\n Attack: §G+20%§!\n Defense: §G+10%§!\n Movement: §G+30%§!\n \n§YHills§!:\n Attack: §G+20%§!\n Defense: §G+10%§!\n Movement: §G+30%§!"

  # Germany
  idea_GER_encirclement_0: "Looming Encirclement"
  idea_GER_encirclement_0_desc: "[THIS.GetNameDefCap] is secure, yet diplomatic prospects remain precarious. The slightest incident is sure to stoke [THIS.GetAdjective] demands for rearmament."
  idea_GER_encirclement_1: "Encroaching Encirclement"
  idea_GER_encirclement_1_desc: "[THIS.GetNameDefCap] finds herself surrounded by potential foes. Public and government alike demand renewed defensive measures, even if that means raising the hackles of our neighbors."
  idea_GER_encirclement_2: "Tightening Encirclement"
  idea_GER_encirclement_2_desc: "Diplomatic maneuvers on the continent further ensnare [THIS.GetNameDef]. [THIS.GetAdjective] citizens cannot ignore the threat: they demand yet greater military measures. The objections of our rivals be damned."
  idea_GER_encirclement_3: "Unshakable Encirclement"
  idea_GER_encirclement_3_desc: "From each direction, enemies menace [THIS.GetAdjective] borders. The assuasions of supposedly neutral neighbors do little to calm the stormy public mood. Preparations for war must be made."

  # Austria
  AUS_hungarian_resistance_0: "Hungary Satisfied"
  AUS_hungarian_resistance_1: "Hungary Disgruntled"
  AUS_hungarian_resistance_2: "Hungary Outraged"
  AUS_hungarian_resistance_3: "Hungary Defiant"
  AUS_minority_resistance_0: "Loyal Minorities"
  AUS_minority_resistance_1: "Disaffected Minorities"
  AUS_minority_resistance_2: "Fractious Minorities"
  AUS_minority_resistance_3: "Partisan Minorities"
  AUS_multi_lingual_empire: "Multi-Lingual Empire"
  AUS_multi_lingual_empire_desc: "[ROOT.GetNameDefCap] is a patchwork of peoples, and its army is no exception."
  AUS_multi_lingual_empire_tt: "§RGenerals can lead fewer divisions.\nField marshals can lead fewer generals.§!"
  AUS_black_hand_cells: "Black Hand Cells"
  AUS_black_hand_cells_desc: "Groups of Serb Nationalists operate quietly within our cities. Their exact intentions, while mysterious, are certainly threatening."
  AUS_black_hand_cells_tt: "§R'Imperial Visit to Bosnia' focus: Delegate will be assassinated.§!"
  AUS_narodna_odbrana: "Bosnian Serb Activists"
  AUS_narodna_odbrana_desc: "The Narodna Odbrana ('National Defense') is an ostensibly peaceful network of Serb nationalists within our borders. Though [SER.GetName] downplays the organisation's significance, its objective of secession from [This.GetName] is brazenly clear."
  AUS_narodna_odbrana_tt: "§RStability lower than 50% will result in [224.GetName], [146.GetName], and [169.GetName] seceeding to [SER.GetName].§!"
  AUS_vojvodina_separatists: "Vojvodina Separatitst"
  AUS_vojvodina_separatists_desc: "Not since the 1848 Revolutions have the Vojvodina Serbs been so nakedly treasonous. Left unchecked, our subjects in this region will surely defect to [SER.GetName]."
  AUS_vojvodina_separatists_tt: "§RStability lower than 50% will result in [224.GetName] and [171.GetName] seceeding to [SER.GetName].§!"
  idea_AUS_influenced_by_austria: "[AUS.GetAdjective] Influence"
  idea_AUS_south_german_placation: "South German Placations"
  idea_AUS_received_loan_for_south_german_autonomy: "Loans for Autonomy"
  idea_AUS_loan_for_south_german_autonomy: "Bankrolling Autonomy"

  # Serbia
  SER_nacertanije: "The Načertanije"
  SER_nacertanije_desc: "Written by Ilija Garašanin during the nascency of independent Serbia, the Načertanije or 'the Draft' is a blueprint of greater Serbia and formulates the ambition of her governments. Macedonia, Albania, Croatia, Bosnia - all are posited as Serbdom within the Načertanije."
  SER_idea_follow_the_independent_radicals: "Follow the Independent Radicals"
  SER_idea_follow_the_independent_radicals_desc: "Encircled by threats Serbia may be, but the delicate foreign policy of past governments must be done away with. Citizens of Serbia now turn to the Independent Radicals and their hardline revaunchism, even if this risks the wrath of powerful neighboring states."
  idea_SER_favoured_by_arbitrator: "Favoured by Arbitrator ([?global.balkan_arbitrator.GetNameWithFlag])"
  idea_SER_favoured_by_arbitrator_turkey_annexation_tt: "In peace conference against §Y[TUR.GetNameWithFlag]:§! Annex cost: §G-33.3%§!"
  idea_SER_balkan_coalition_founder: "Leader of the Balkan League"
  idea_SER_balkan_coalition_founder_desc: "Not yet a full-throated alliance, the Balkan League is a shaky coalition whose aims are limited to the defeat of [TUR.GetNameDef] in Europe.\n\nDisputes and mistrust prevent the forming of a lasting alliance. Should these disputes be overcome, a power bloc in the region may yet arise."
  idea_SER_balkan_coalition_tt: "§YMembers can join each other in a war against [TUR.GetNameWithFlag]§!"
  idea_SER_balkan_coalition_member: "Member of the Balkan League"
  idea_SER_balkan_coalition_member_desc: "Not yet a full-throated alliance, the Balkan League is a shaky coalition whose aims are limited to the defeat of [TUR.GetNameDef] in Europe.\n\nDisputes and mistrust prevent the forming of a lasting alliance. Should these disputes be overcome, a power bloc in the region may yet rise."

  # Russia
  idea_SOV_autocratic_tsardom: "Autocratic Tsardom"
  idea_SOV_autocratic_tsardom_law_change_cost_tt: "Changing laws costs $tsar_favor_resource$"
  idea_SOV_autocratic_tsardom_government_change_disallowed_tt: "Cannot change $government$ from §Y$gov_absolute_monarchy$§!"
  idea_SOV_revolution_in_waiting_0: "Revolution in Waiting"
  idea_SOV_revolution_in_waiting_0_civil_war_tt: "When §Y$revolutionary$§! reaches [?SOV.civil_war_revolutionary_threshold|%Y] popularity:\n§RActivates Mission: $mission_SOV_bolshevik_revolution_imminent$§!"
  idea_SOV_revolution_in_waiting_1: "Revolution in Waiting"
  idea_SOV_revolution_in_waiting_1_civil_war_tt: "When §Y$revolutionary$§! reaches [?SOV.civil_war_revolutionary_threshold|%Y] popularity:\n§RActivates Mission: $mission_SOV_bolshevik_revolution_imminent$§!"

  # France
  idea_FRA_le_pantalon_rouge: "Le Pantalon Rouge"
  idea_FRA_le_pantalon_rouge_desc: "So striking is the French military uniform that neither the army nor the public can bear to part with it, despite a mounting case that it will do us no good in the wars to come."
  idea_FRA_le_pantalon_rouge_tt: "§RCannot unlock the § §Y$pragmatic_uniform$§ §R land doctrine§"