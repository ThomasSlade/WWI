l_english:
  CONCERT_OF_EUROPE_NAME: "The Concert of Europe"
  CONCERT_OF_EUROPE_DESC: "A century of multipolar diplomacy and interwoven interests has kept the peace in Europe. Awash in the winnings of its industrialisation, the continent has slept easily beneath  the powers since the days of Victoria, Metternich, and Bismarck. But a peculiar fastening of the two great alliance blocks - those of central europe and those beyond it - feeds the speculations of journalists and the worries of statesmen alike. If the Concert of Europe unravels, will the continent return to Iron and Blood?"
  AUS_CONCERT_OF_EUROPE: "Stangant deadlock has been the political way of life in Vienna since the signing of the Augsleich - an agreement with Hungary tying the fates of the two nations together, but in the process elevating an obstructive Hungarian elite to power.\n\nNow, many decades after the springtime of nations, the monarchy's mosaic of peoples grow restless for reform, and while some lawmakers on the Danube seek to provide it, they meet stern resistance from downstream. If Austria-Hungary cannot be transformed, it will be torn appart by the nascent forces of nationalism."
  SER_CONCERT_OF_EUROPE: "The Serb struggle against the Ottomans is nearing its end. Yet instigators of this freedom - the Obrenović dynasty - met their fates at the hands of their own people not ten years ago.\n\nAlthough Serbia has since forged itself into a stable regime, the currents of irredentism run deep in Belgrade's barracks and coffee houses, and whether or not the Radicals can contain them remains unclear. This, all the more disquieting, as Austria seeks any excuse to regain influence in it's small Balkan neighbor fresh from the Habsburg shadow."
  SOV_CONCERT_OF_EUROPE: "Tsar Nicholas II heads the three-hundred year-old Romanov dynasty, and Russia remains his personal plaything. Despite Russia's industrialisation on the coat-tails of the West, reaching a fever-pitch in the 1905 revolution which threatened to dismantle the ancient Tsardom, the stubborn emperor resists even the most moderate reform to appease his restless people.\n\nThe liberal circles of St. Petersburg conspire to break this iron grip with increasing impatience, knowing that Russia's peasants and workers grow weary, and that Vladimir Lenin awaits their radicalisation from overseas."