l_english:
  CONCERT_OF_EUROPE_NAME: "The Concert of Europe"
  CONCERT_OF_EUROPE_DESC: "A century of multipolar diplomacy and interwoven interests has kept the peace in Europe. Awash in the winnings of its industrialisation, the continent has slept easily beneath  the powers since the days of Victoria, Metternich, and Bismarck. But a peculiar fastening of the two great alliance blocks - those of central europe and those beyond it - feeds the speculations of journalists and the worries of statesmen alike. If the Concert of Europe unravels, will the continent return to Iron and Blood?"
  AUS_CONCERT_OF_EUROPE: "Deadlock and stagnation has been the political way of life in Vienna since the Augsleich with Hungary - an agreement tying the fates of the two nations together, but elevating an obstructive Hungarian elite to power in the process. Now, many decades after the springtime of nations, the monarchy's many peoples grow restless for reform, and while some in Austria seek to provide it, they meet overwhelming resistance from down the Danube. If Austria-Hungary cannot meet its peoples' demands, it will be torn appart by the nascent forces of nationalism."
  SER_CONCERT_OF_EUROPE: "The bloody struggle for Serbian freedom from the Ottomans may finally be nearing its end. Yet instigators of this freedom - the Obrenović dynasty - met their fates at the hands of their own people not ten years ago, in the May Coup. Although Serbia has since upheld itself as a steady democracy, currents of Serb irredentism run deep into Belgrade's barracks and coffee houses, and it remains unclear if the Radicals can restrain them. This all the more disquieting, as Austria seeks an excuse to regain influence in this small Balkan neighbor fresh from the Habsburg shadow."