l_english:
  event_SOV_russian_reform.1.t: "Land Reform in [reformed_state.GetName] a Success"
  event_SOV_russian_reform.1.d: "The rural communes surrounding [reformed_state.GetName] have been dismantled: the countryside is increasingly dense with Khutora and Otruba smallholders, who quickly take a shine to our regime.\n\nWith their support, [reformed_state.GetName] revolutionaries have lost the discontents needed to swell their masses."
  event_SOV_russian_reform.1.a: "Inform the Tsar of this progress."
  event_SOV_russian_reform.1.b: "Ensure the smallholders' profits are invested."
  event_SOV_russian_reform.1.c: "Put the peasants to work."
  event_SOV_russian_reform.1.d: "Exploit the abandoned land."