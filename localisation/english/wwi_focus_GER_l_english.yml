l_english:
	GER_the_reichsland_of_alsace_lorraine: "The Alsatian Constitution"
	GER_the_reichsland_of_alsace_lorraine_desc: "Elsaß–Lothringen, an at-times unruly trophy of our victory over France, has remained in a state of limbo since its annexation into the Reich. Granting the territory a Landtag and representing it on the Federal council will begin the process of proper integration."
	GER_zabern_affair: "The Zabern Affair"
	GER_zabern_affair_desc: "The Alsatian majority of Elsaß–Lothringen - not least its French-speaking counterpart - are a volatile mix with their [THIS.GetNameDef] garrison. The Prussian army being what it is, conflict with its own citizens is bound to erupt at the Empire's fringes."
	GER_the_alsatian_lander: "The Länder of Elsaß–Lothringen"
	GER_the_alsatian_lander_desc: "Decades of animosity between [THIS.GetNameDef] and the Alsatians have finally given way to mutual understanding. We have the chance to win the loyalty of the Imperial Territory once and for all, by granting it equal status to that of Bavaria, Württemberg, and Baden."