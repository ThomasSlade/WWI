l_english:
  event_GER_zabern_affair.1.t: "The Zabern Affair"
  event_GER_zabern_affair.1.d: "'If you stab such a Wackes, you'll get ten marks from me.'\n\nThese words were spoken by a member of the Alsace-Lorraine garrison in Zabern, to the outrage of the 'Wackese' they disparage. A standoff between the townsfolk and its barracks escalated to civilian arrests, while the offending soldier has since struck down an unarmed heckler with his sabre.\n\nWith outrage from Alsace-Lorraine now reaching [THIS.capital.GetCapitalVictoryPointName], [GER_erich_von_falkenhayn.GetName] must advocate for the officers' actions before a disapproving government."
  event_GER_zabern_affair.1.a: "We must defend the officers."
  event_GER_zabern_affair.1.b: "This is not the view of the Reichstag."

  event_GER_recruit_foreign_tank_designers.1.t: "Armored-Vehicle Inventor [AUS_gunter_burstyn.GetName] Offers His Services"
  event_GER_recruit_foreign_tank_designers.1.d: "Tiring of the disinterest of the [AUS.GetAdjective] military in his proposals, [AUS_gunter_burstyn.GetName] has been lobbying for the attention of our own engineering department.\n\nThe [AUS.GetAdjective] inventor has, for some years, insisted upon the development of an all-terrain, turreted, armored fighting vehicle. The Motorgeschütz, he claims, would be critical in a modern war made stagnant by otherwise unsurpassable firepower."
  event_GER_recruit_foreign_tank_designers.1.a: "Perhaps we could use his ideas."

  event_GER_recruit_foreign_tank_designers.2.t: "Armored-Vehicle Inventor [AUS_gunter_burstyn.GetName] Leaves [AUS.GetName] for [GER.GetAdjective] Employment"
  event_GER_recruit_foreign_tank_designers.2.d: "Tiring of the disinterest of the [AUS.GetAdjective] military in his proposals, [AUS_gunter_burstyn.GetName] has found a new audience for his inventions in [GET.capital.GetCapitalVictoryPointName].\n\nThe [AUS.GetAdjective] inventor has, for some years, insisted upon the development of an all-terrain, turreted, armored fighting vehicle. The Motorgeschütz, he claims, could have been indespensible to [AUS.GetNameDef] in wars to come."
  event_GER_recruit_foreign_tank_designers.2.a: "Disloyalty is of no use to us."

  event_GER_recruit_foreign_tank_designers.3.t: "Armored-Vehicle Inventor [ENG_lancelot_de_mole.GetName] Offers His Services"
  event_GER_recruit_foreign_tank_designers.3.d: "Our consulate in [AST.GetNameDef] has forwarded the interesting designs of a military engingeer by the name of [ENG_lancelot_de_mole.GetName]. Exhausted with the labyrinthine bureaucracy of the [ENG.GetAdjective] War Office, he now seeks [GER.GetAdjective] investment to prove out his concepts.\n\n[ENG_lancelot_de_mole.GetSurname]'s caterpillar-tracked vehicle would provide armored support on all terrains, including across trenches. Essential, he warns, in the fights to come."
  event_GER_recruit_foreign_tank_designers.3.a: "Perhaps we could use his ideas."

  event_GER_recruit_foreign_tank_designers.4.t: "Armored-Vehicle Inventor [ENG_lancelot_de_mole.GetName] Leaves [AST.GetName] for [GER.GetAdjective] Employment"
  event_GER_recruit_foreign_tank_designers.4.d: "Exhausted with the labyrinthine bureaucracy of the [ENG.GetAdjective] War Office, vehicle engineer [ENG_lancelot_de_mole.GetName] has quietly offered up his services to the [GER.GetAdjective] government.\n\n[ENG_lancelot_de_mole.GetSurname]'s caterpillar-tracked vehicle would provide armored support on all terrains, including across trenches. Essential, he had warned, in the fights to come."
  event_GER_recruit_foreign_tank_designers.4.a: "Rather unpatriotic."

  event_GER_reserve_rights.1.t: "[FROM.GetName] Objects to Low Share of Industry"
  event_GER_reserve_rights.1.d: "The nobility of [FROM.GetNameDef] have made known their outrage at the federated state's falling behind in industry, taking it as a deliberate snub on the part of [THIS.capital.GetCapitalVictoryPointName].\n\nUntil we correct this divergence, we can expect [FROM.GetNameDef] to withhold its economic contributions from the Reich."
  event_GER_reserve_rights.1.d_alsatian_plebiscite: "Citizens of [FROM.GetNameDef] have expressed their dismay at the region's low share of industrial investment, going so far as to take it as a symptom of maligned treatment of the recently-incoorpirated territory by [THIS.capital.GetCapitalVictoryPointName].\n\nIt's expected that this sentiment will see the province vote to leave [THIS.GetNameDef] in the coming plebiscite."
  event_GER_reserve_rights.1.a: "Throw these scoundrels a bone."
  event_GER_reserve_rights.1.a_alsatian_plebiscite: "We must regain their trust."

  event_GER_reserve_rights.2.t: "[FROM.GetName] Satisfied with Increased Industry Share"
  event_GER_reserve_rights.2.d: "After a renewed account of [THIS.GetAdjective] industry, the nobles of [FROM.GetNameDef] have expressed a desire for a return to cooperation with [THIS.capital.GetCapitalVictoryPointName].\n\nSo long as their share in government contracts remains plump, we can count on the federated state's support."
  event_GER_reserve_rights.2.d_alsatian_plebiscite: "Following a drop in pro-[THIS.GetAdjective] sentiment surrounding the looming plebiscite, renewed investment into [FROM.GetAdjective] industry has led to revived support for [THIS.GetAdjective] statehood.\n\nIf the issue can be kept under control, we can count on [FROM.GetNameDef] seeing sense come the referendum."
  event_GER_reserve_rights.2.a: "Enough of this nonsense, then."
  event_GER_reserve_rights.2.a_alsatian_plebiscite: "[FROM.GetNameDef] is integral to [THIS.GetNameDef]."

  event_GER_reserve_rights.3.t: "[FROM.GetName] Concerned With Lagging Industry Share"
  event_GER_reserve_rights.3.d: "Some federated states have retained substantial power following a reluctant ascent into the Reich. Among them is [FROM.GetNameDef], whose delegates in the Bundesrat have expressed dismay over the region's lack of industrial investment from [THIS.capital.GetCapitalVictoryPointName].\n\nIf the [FROM.GetAdjective] share in industry falls too low, its leadership may find ways to hamper our governing."
  event_GER_reserve_rights.3.d: "Amid the upcoming plebiscite on the status of [FROM.GetNameDef] within [THIS.GetNameDef], a number of [FROM.GetAdjective] business owners have voiced their dissatisafaction over the region's falling share of [THIS.GetAdjective] industry.\n\nWhile others in the [FROM.GetAdjective] electorate remain confident in the Reich, this number threatens to dwindle should the region's economy be left behind."
  event_GER_reserve_rights.3.a: "We must invest each of our states fairly ..."
  event_GER_reserve_rights.3.a_alsatian_plebiscite: "[FROM.GetName] must be kept onside."

  event_GER_schlieffen_plan.1.t: "The Schlieffen Plan"
  event_GER_schlieffen_plan.1.d_france: "While the [FRA.GetAdjective] army concentrates at our borders, our General Staff have long since planned a counter-invasion that would sweep through the low countries and surround Paris.$event_GER_schlieffen_plan.1.d_ending$"
  event_GER_schlieffen_plan.1.d_generic: "While our enemies in the west concentrate their forces, our General Staff have long since planned a pre-emptive occupation of the low countries as an avenue of counter-invasion, seizing crucial ports and industry in the region along the way.\n\n$event_GER_schlieffen_plan.1.d_ending$"
  event_GER_schlieffen_plan.1.d_ending: "Though we intend to allow [BEL.GetNameDef] to maintain its sovreignty, it's likely the government in [BEL.capital.GetCapitalVictoryPointName] will see our incursion as an act of war, risking the ire other Great Powers in the region.\n\nNonetheless, the plan is ready to execute."
  event_GER_schlieffen_plan.1.a_france: "The French won't suspect a thing."
  event_GER_schlieffen_plan.1.a_generic: "The enemy won't suspect a thing."
  event_GER_schlieffen_plan.1.b: "Launch the invasion, but spare [HOL.GetNameDef]."
  event_GER_schlieffen_plan.1.c: "More preparations are needed."

  event_GER_alsace_plebiscite.1.t: "The Plebiscite of Elsaß–Lothringen"
  event_GER_alsace_plebiscite.1.d: "Recognising that an unruly buffer-zone has little to offer [THIS.GetNameDef], [THIS.GetLeader] has at last acquiesced to Alsatian demands of a plebiscite on the region's German statehood.\n\nExcitement at this announcement washes over [2.GetCapitalVictoryPointName] and [107.GetCapitalVictoryPointName], where rows erupt in the streets between French and German speakers. Despite the territory's troubled relationship with [THIS.capital.GetCapitalVictoryPointName], a growing number of Alsatians have come to favour [THIS.GetAdjective] rule.\n\nIf we can win their trust, they may yet make a majority."
  event_GER_alsace_plebiscite.1.d_france: "Caving at last to the demands of Alsatian protest-deputies, [THIS.GetLeader] announced this afternoon the holding of a plebiscite to settle the status of Alsace-Lorraine - annexed by [FROM.GetNameDef] four decades ago, and the foremost demand of many [THIS.GetAdjective] nationalists ever since.\n\nPromising [THIS.GetAdjective] oversight of the election, the [FROM.GetAdjective] foreign office has expressed hope that a democratic solution to the dispute may bring about a detente between [FROM.capital.GetCapitalVictoryPointName] and [THIS.capital.GetCapitalVictoryPointName], whatever the plebiscite's outcome."
  event_GER_alsace_plebiscite.1.a: "Elsaß–Lothringen must make its choice."
  event_GER_alsace_plebiscite.1.a_france: "Alsace-Lorraine is [THIS.GetAdjective], you will see."

  event_GER_alsace_plebiscite.2.t: "Elsaß–Lothringen Elects to Remain [GER.GetAdjective]"
  event_GER_alsace_plebiscite.2.t_partial: "Alsace-Lorraine Split Between [GER.GetOldName] and [FRA.GetOldName]"
  event_GER_alsace_plebiscite.2.t_french: "Alsace-Lorraine Returned to [FRA.GetOldName]"
  event_GER_alsace_plebiscite.2.d: "Following a historic plebiscite to settle the sensitive issue of the [GER.GetAdjective]-[FRA.GetAdjective] border region, a majority of Alsatians and Lorrainers have voted to remain a [GER.GetAdjective] state.\n\nThe result reflects the growing economic integration of Alsace-Lorraine - or Elsaß–Lothringen - with its occupier.\n\nThough the mood in [FRA.capital.GetCapitalVictoryPointName] is bitter, it's hoped by moderates on each side of the Rhine that the result will dissipate tension between their countries."
  event_GER_alsace_plebiscite.2.d_partial: "Following a historic plebiscite to settle the sensitive issue of the [GER.GetAdjective]-[FRA.GetAdjective] border region, Alsace-Lorraine has been re-partitioned along self-determined lines between its claimants.\n\nWhile firebrands in [FRA.capital.GetCapitalVictoryPointName] remain dissatisfied, it's hoped by moderates on each side of the Rhine that the result will dissipate tension between their countries."
  event_GER_alsace_plebiscite.2.d_french: "Following a historic plebiscite to settle the sensitive issue of the [GER.GetAdjective]-[FRA.GetAdjective] border region, the majority of Alsatians and Lorrainers have voted to return to [FRA.GetNameDef], ending four decades of [GER.GetAdjective] occupation.\n\nWhile some [FRA.GetAdjective] nationalists remain embittered over the territory's original annexation, it's hoped by moderates on each side of the Rhine that the result will dissipate tension between their countries."
  event_GER_alsace_plebiscite.2.a: "Perhaps the issue is settled?"
  event_GER_alsace_plebiscite.2.a_germany: "By choice, not by sword, Elsaß–Lothringen is [GER.GetAdjective]."
  event_GER_alsace_plebiscite.2.a_france: "Few will entertain our claims after this."
  event_GER_alsace_plebiscite.2.a_partial_germany: "An acceptable result."
  event_GER_alsace_plebiscite.2.a_partial_france: "We still say it's all ours."
  event_GER_alsace_plebiscite.2.a_french_germany: "They would really rather be [FRA.GetAdjective]?"
  event_GER_alsace_plebiscite.2.a_french_france: "Alsace-Lorraine is [FRA.GetOldName]!"