l_english:
  event_WWI_balkan_league_first_balkan_war.1.t: "[?global.balkan_league_leader.GetName] Declares Balkan War"
  event_WWI_balkan_league_first_balkan_war.1.d_start: "The Balkan region's reputation as a powderkeg has proven well-earned with the outbreak of war in Europe's South-East.\n\n"
  event_WWI_balkan_league_first_balkan_war.1.d_end: "has emboldened its upstart neighbors to proclaim themselves 'the [?global.balkan_league_leader.GetFactionName]' and drive the last slither of [TUR.GetAdjective] influence from Europe.\n\nThe [?global.balkan_league_leader.GetFactionName]'s partnership is a brittle one: cynical observers do not imagine it will last."
  event_WWI_balkan_league_first_balkan_war.1.d: "$event_WWI_balkan_league_first_balkan_war.1.d_start$A weakened [TUR.GetAdjective] grip on its European minorities $event_WWI_balkan_league_first_balkan_war.1.d_end$"
  event_WWI_balkan_league_first_balkan_war.1.d_turkey_humiliated: "$event_WWI_balkan_league_first_balkan_war.1.d_start$A weakened [TUR.GetAdjective] grip on its European minorities, compounded by its recent [?global.turkish_humiliator.GetAdjective] humiliation, $event_WWI_balkan_league_first_balkan_war.1.d_end$"
  event_WWI_balkan_league_first_balkan_war.1.a_member: "We will dislodge [TUR.GetNameDef] at last."
  event_WWI_balkan_league_first_balkan_war.1.a_neutral: "Can [TUR.GetNameDef] be defeated by such ragtag nations?"
  event_WWI_balkan_league_first_balkan_war.1.a_negative: "[TUR.GetNameDefCap] is a keystone of Balkan stability!"

  event_WWI_balkan_league_first_balkan_war.2.t: "Infighting Looms Amid [?global.balkan_league_leader.GetFactionName] Victory"
  event_WWI_balkan_league_first_balkan_war.2.d: "We are triumphant in the Balkans. [THIS.GetNameDefCap] and her allies stand tall.\n\nBut beneath the jubilant pretense of [?global.balkan_league_leader.GetFactionName] solidarity, disagreements over the division of our winnings have already begun to fester. Such disputes, left unresolved, threaten to tear our alliance apart and plunge us into war against our cobelligerents.\n\nWill the [?global.balkan_league_leader.GetFactionName] survive the quibblings of its members?"
  event_WWI_balkan_league_first_balkan_war.2.a: "Who can say?"

  event_WWI_balkan_league_second_balkan_war.1.t: "War Against the [?global.balkan_league_leader.GetFactionName]"
  event_WWI_balkan_league_second_balkan_war.1.d: "The refusal of the [?global.balkan_league_leader.GetFactionName] to accept our claims has reached a boiling point in leadership and citizen alike: the time has come for war against our former allies\n\nThough [THIS.GetNameDef] has much to gain, more doveish ministers quietly comment that such a conflict would leave our nation vulnerable to an invasion from hostile neighbors."
  event_WWI_balkan_league_second_balkan_war.1.a: "[THIS.GetNameDefCap] will have what is rightfully hers."
  event_WWI_balkan_league_second_balkan_war.2.t: "The [THIS.GetFactionName] Undone by [FROM.GetAdjective] Aggression"
  event_WWI_balkan_league_second_balkan_war.2.d: "In what the press has described as an international betrayal, [FROM.GetNameDef] has withdrawn its ambassadors from [THIS.capital.GetCapitalVictoryPointName] and concentrated troops on the borders of it's claimed Balkan territories.\n\nThe turning of a [THIS.GetFactionName] member on its allies is undoubtebly a massive blow to the alliance's integrity: already, remaining members speak of the arrangement in temporary terms.\n\nIt was hoped that peace would prevail among our sister nations. Alas, [FROM.GetNameDef] has chosen war."
  event_WWI_balkan_league_second_balkan_war.2.a: "A stab in the back."
  event_WWI_balkan_league_second_balkan_war.3.t: "[FROM.GetName] Ignites Second Balkan War"
  event_WWI_balkan_league_second_balkan_war.3.d: "Disagreements over the spoils of its recent victory have proven too great for the [?global.balkan_league_leader.GetFactionName]: in a dramatic changing of diplomatic winds, [FROM.GetNameDef] has declared a war against its former allies to forcibly obtain its disputed Balkan territories.\n\nThe once promising [?global.balkan_league_leader.GetFactionName] faces a devastating blow to its credibility as a worthwhile alliance: many of its members appear to consider the partnership finished."
  event_WWI_balkan_league_second_balkan_war.3.a_attacker: "What remains of the [?global.balkan_league_leader.GetFactionName] will be crushed."
  event_WWI_balkan_league_second_balkan_war.3.a_defender: "[FROM.GetNameDefCap] must be stopped."
  event_WWI_balkan_league_second_balkan_war.3.a_neutral: "Will thie bloodshed ever end?"

  event_WWI_balkan_league_second_balkan_war.4.t: "A Chance to Strike [FROM.GetName]"
  event_WWI_balkan_league_second_balkan_war.4.d: "[FROM.GetAdjective] military and diplomatic isolation in the wake of the war with its former allies presents us with a unique opportunity.\n\n[FROM.capital.GetCapitalVictoryPointName] now being something of a pariah, we have a chance to attack the already overwhelmed [FROM.GetAdjective] army without repercussion and occupy our claimed territories."
  event_WWI_balkan_league_second_balkan_war.4.a: "Yes. While [FROM.GetNameDef] is weak."
  event_WWI_balkan_league_second_balkan_war.4.b: "Now is not the time."

  event_WWI_balkan_league_second_balkan_war.6.t: "The Second Balkan War Ends"
  event_WWI_balkan_league_second_balkan_war.6.d: "War between the former Balkan partners has ended: [?global.second_balkan_war_attacker.GetNameDef], outnumbered and diplomatically isolated, has admitted its defeat. It stands to lose much of what it gained in the First Balkan War.\n\nThough the collapse of the Balkan alliance was a surprise to few, spectators have been alarmed at the chaos on the peninsula. Many wonder if this will be the last Balkan War."
  event_WWI_balkan_league_second_balkan_war.6.d_attacker_wins: "War between the former Balkan partners has ended: despite being outnumbered and isolated, [?global.second_balkan_war_attacker.GetNameDef] emerges victorious. Yet more of the region will fall to her control.\n\nThough the collapse of the Balkan alliance was a surprise to few, spectators have been alarmed at the chaos on the peninsula. Many wonder if this will be the last Balkan War."
  event_WWI_balkan_league_second_balkan_war.6.a_neutral: "Unlikely."
  event_WWI_balkan_league_second_balkan_war.6.a_participant: "We must be ready."
  event_WWI_balkan_league_second_balkan_war.6.a_loser: "This isn't over."

  event_WWI_balkan_league_resolve_dispute.1.t: "[FROM.GetName] Offers Concession to End [disputed_state.GetName] Dispute"
  event_WWI_balkan_league_resolve_dispute.1.d: "Seeking concord amongst the Balkan War victors, [FROM.GetAdjective] negotiators have insisted that we end our posturing over [disputed_state.controller.GetAdjective]-occupied [disputed_state.GetName].\n\nWe have been asked to name the price of our cooperation."
  event_WWI_balkan_league_resolve_dispute.1.a: "We demand industrial reparations."
  event_WWI_balkan_league_resolve_dispute.1.b: "We demand military reparations."
  event_WWI_balkan_league_resolve_dispute.1.c: "We demand resource reparations."
  event_WWI_balkan_league_resolve_dispute.2.t_industry: "[FROM.GetName] Accepts [disputed_state.GetName] Resolution for Industrial Reparations"
  event_WWI_balkan_league_resolve_dispute.2.t_military: "[FROM.GetName] Accepts [disputed_state.GetName] Resolution for Military Reparations"
  event_WWI_balkan_league_resolve_dispute.2.t_resource: "[FROM.GetName] Accepts [disputed_state.GetName] Resolution for Resource Reparations"
  event_WWI_balkan_league_resolve_dispute.2.d: "Our intervention has preserved the integrity of the [THIS.GetFactionName]: [FROM.GetNameDef] has agreed to recognise [disputed_state.owner.GetAdjective] ownership of [disputed_state.GetName]."
  event_WWI_balkan_league_resolve_dispute.2.a: "Worthwhile."

  event_WWI_balkan_league_presence_intensified.1.t: "[FROM.GetName] Concentrates Forces in [occupied_state.GetName]"
  event_WWI_balkan_league_presence_intensified.1.d: "Despite our allies' agreements following the Balkan War, our presence in [occupied_state.GetName] has been deliberately superseded by a massing of [FROM.GetAdjective] troops in the region, de facto removing it from our control.\n\nIt's clear that [FROM.GetNameDef] finds the post-war arrangement unsatisfactory."
  event_WWI_balkan_league_presence_intensified.1.a: "[occupied_state.GetName] was won with [THIS.GetAdjective] blood!"

  event_WWI_balkan_league_second_balkan_war_averted.1.t: "The [FROM.GetFactionName] Settles Its Disputes"
  event_WWI_balkan_league_second_balkan_war_averted.1.d: "The formation of the [FROM.GetFactionName] was broadly met with scepticism over the capacity of its quarelsome members to cooperate, and indeed its integrity was strained in the Balkan War's aftermath.\n\nHowever, [FROM.GetNameDef] and its peers have proudly announced their intentions to uphold the [FROM.GetFactionName] for years to come, following a hard-won settlement lead by [?global.most_balkan_resolutions_country.GetAdjective] negotiators.\n\nThe brow of many a pundit is raised at this unlikely partnership outlasting its first trial."
  event_WWI_balkan_league_second_balkan_war_averted.1.a_neutral: "[?global.most_balkan_resolutions_country.GetAdjective] diplomacy has proven tenacious."
  event_WWI_balkan_league_second_balkan_war_averted.1.a_negative: "A grave threat to our Balkan interests!"