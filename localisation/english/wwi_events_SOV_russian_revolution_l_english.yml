l_english:
  event_SOV_russian_revolution.1.t: "Civil War on the Horizon"
  event_SOV_russian_revolution.1.d: "Not since 1905 has [THIS.GetAdjective] society been so restless. The unsettled business of Bloody Sunday rears its head in the tenemants and barracks of [THIS.capital.GetCapitalVictoryPointName], this time with the Bolsheviks firmly at its vanguard.\n\nThen as now, the Tsar underestimates the threat. But the ministers of [THIS.GetNameDef] know better. The country faces Civil War."
  event_SOV_russian_revolution.1.d_not_tsarist: "The reforms bestowed upon our young republic have failed to sate the radicalism of the [THIS.GetAdjective] people. Uncompromising Bolsheviks spar with stubborn conservatives over the nation's fate, with increasingly little ground for compromise left between them.\n\nDespite all the triumph and hope of the new [THIS.GetName], the country faces Civil War."
  event_SOV_russian_revolution.1.a: "Get this empire under control!"
  event_SOV_russian_revolution.1.a_not_tsarist: "Get this nation under control!"
  event_SOV_russian_revolution.2.t: "Civil War Forestalled"
  event_SOV_russian_revolution.2.d: "Many sleepless nights of conniving in the [THIS.GetSeatOfRussianGovernment] have borne fruit: the radicals withdraw to the underground, and the Bolsheviks reorient their rhetoric to hypotheticals.\n\nThe Civil War is averted."
  event_SOV_russian_revolution.2.a: "For now."

  event_SOV_russian_revolution.3.t: "Civil War Looms in [FROM.GetName]"
  event_SOV_russian_revolution.3.d: "Though the failed [FROM.GetAdjective] revolution of 1905 has become a distant memory for some, its unattained ambitions ring louder than ever in the ears of the [FROM.GetAdjective] people.\n\nWhile the unarmed demonstrators of Bloody Sunday were yet to affiliate themselves with the revolution, today's [FROM.GetName] makes no such mistake. Bolshevik voices come to dominate the underground of [FROM.capital.GetCapitalVictoryPointName], and they call for no less than the destruction of the Tsardom, as well as the withdrawal of [FROM.GetNameDef] from international alliances.\n\nIf [FROM.GetLeader] cannot control the situation, Civil War seems inevitable."
  event_SOV_russian_revolution.3.d_not_tsarist: "Despite the efforts of [FROM.GetAdjective] reformers to quash the memory of 1905 through political change, the young republic now faces its greatest unrest of the century.\n\nDissatisfied with the similarity of the new regime's conduct with the old, Bolshevik voices lead the chants of Peace, Land, and Bread rising from [FROM.GetOldNameDef]'s' fields and factories. They call for no less than the overturning of bourgeois democracy, and the withdrawal of [FROM.GetOldNameDef] from international alliances.\n\nIf [FROM.GetLeader] cannot control the situation, Civil War seems inevitable."
  event_SOV_russian_revolution.3.a: "[FROM.GetOldNameDefCap] plummets further into crisis."
  event_SOV_russian_revolution.3.b: "This cannot be allowed to happen."
  event_SOV_russian_revolution.3.c: "Yes, fight amongst yourselves."

  event_SOV_russian_revolution.4.t: "Civil War Forestalled in [FROM.GetName]"
  event_SOV_russian_revolution.4.d: "Though a collapse into competing governments seemed inevitable in [FROM.GetNameDef], [FROM.GetLeader] has enjoyed a miraculous turn of fortune, to the surprise of loyalists and Bolsheviks alike.\n\nThe moment for revolution has passed, it seems, as radical elements peel away from the squares of [FROM.capital.GetCapitalVictoryPointName], nonetheless confident in their proclamations that [FROM.GetOldNameDef] will rise up with them soon enough."
  event_SOV_russian_revolution.4.a: "They may well be right."

  event_SOV_russian_revolution.5.t: "The Bolsheviks Stage a Revolution"
  event_SOV_russian_revolution.5.d: "Telegrams of increasing urgency emanate from [revolutionary_state.GetCapitalVictoryPointName] one frosty [THIS.GetAdjective] night: the Bolshevik presence in the city, known to the government but apparently underestimated, deploys columns of armed workers to descend upon state institutions. The mayor's last communiqué is a plea for support, but a loyal [THIS.GetAdjective] fighting force is slow to muster in these times.\n\nAs the hours pass, the situation becomes undeniable. [?global.russian_civil_war_revolutionaries:capital.GetName] is under Bolshevik control, with other radical regions to follow. Civil War has come to Russia."
  event_SOV_russian_revolution.5.d_lost_capital: "In the dead of the frosty [revolutionary_state.GetCapitalVictoryPointName] night, with many exhausted ministers still at their desks, Bolshevik columns descend upon the [revolutionary_state.GetRussiaSeatOfGovernment].\n\nThey face scant resistance. Garrisons in the capital have long since joined their ranks: only high-minded loyalists come to the defence of the regime, fed by what bread the Palace bureaucrats can carry from their homes.\n\nAs the guns of the disgruntled [THIS.GetOctoberRevolutionCannonType] are trained upon the regime's residence, and warning shots are fired, [THIS.GetLeader] already is already boarding a train to [THIS.capital.GetCapitalVictoryPointName]."
  event_SOV_russian_revolution.5.a: "The fight for [THIS.GetOldNameDef] begins."
  event_SOV_russian_revolution.6.t: "The [FROM.GetOldAdjective] Civil War"
  event_SOV_russian_revolution.6.d: "Centuries of absolutism have worn heavily on the Tsar's people, and although the regime's iron fist has held tight across numerous crises, today it finally loses its grip.\n\nWorkers and peasants, long since abandoning the hope of liberal reform, have erupted into revolution. Columns socialists and radicals, lead by the Bolsheviks, seize [?FROM.civil_war_opponent.capital.GetCapitalVictoryPointName] and declare a new [?FROM.sivil_war_opponent.GetAdjective] government.\n\nThe ancient monarchy, forced to withdraw from its diplomatic commitments on the world stage, assembles in [FROM.capital.GetCapitalVictoryPointName] to put down the uprising, but as city after city joins Bolsheviks, the reality of Civil War crystalizes."
  event_SOV_russian_revolution.6.d_not_tsarist: "The fragile peace of the new [FROM.GetAdjective] state has come crashing to ruin, as a Bolshevik coup proclaims a new government from [?global.russian_civil_war_revolutionaries:capital.GetCapitalVictoryPointName].\n\nRevolutionary socialists and radicals of many stripes, united in their exhaustion with the young admintstration's failings, have rallied the embittered [FROM.GetOldAdjective] army to their flanks and displaced the increasingly unpopular government.\n\nLoyalists of [FROM.GetLeader]'s [FROM.GetOldName], forced to withdraw from international alliances, assemble their share of the nation at [FROM.capital.GetCapitalVictoryPointName] and prepare for Civil War."
  event_SOV_russian_revolution.6.a: "Catastrophic."
  event_SOV_russian_revolution.6.b: "Now is not the time for this!"
  event_SOV_russian_revolution.6.c: "One less concern."
  event_SOV_russian_revolution.7.t: "[FROM.GetNameDefCap] Calls for Armistice"
  event_SOV_russian_revolution.7.d: "The eruption of Civil War in [FROM.GetOldNameDef] has forced the once steady hand of our enemies in [FROM.capital.GetCapitalVictoryPointName]: amid desperate calls for peace among [FROM.GetLeader.GetHerHis] supporters, [FROM.GetLeader] has requested we conclude our hostilities so that [FROM.GetNameDef] can turn its attention to slaughtering its own countrymen.\n\nA premature peace would free our troops for other fronts, but we'd see greater spoils in the event of [FROM.GetOldName]'s utter capitulation."
  event_SOV_russian_revolution.7.a: "Very well."
  event_SOV_russian_revolution.7.b: "We will accept surrender when we reach [FROM.capital.GetCapitalVictoryPointName]."
  event_SOV_russian_revolution.8.t: "Revolution in [THIS.capital.GetCapitalVictoryPointName]"
  event_SOV_russian_revolution.8.d: "The many bread-queues of the capital are a hotbed of political opposition: waiting hours for a bitter, slim loaf, the exhausted [THIS.capital.GetCapitalVictoryPointName] masses increasingly air their rumblings for the regime on the streets.\n\nToday, those rumblings became a march, and that march became a revolution. Many thousands of hungry [THIS.GetAdjective]s assembled at the city promenades, facing Cossacks as they approached the [THIS.capital.RussiaGetSeatOfGovernment]: the Cossacks did not fire.\n\nAs the crowds fill the Duma to demand its ministers take control, workers and soldiers convene in the empty halls to form a council - a Soviet - of their own. The one lead by liberals, the other by socialists, it's unclear how this ramshackle government can hope to share its power.\n\nWhat is clear is that [THIS.GetLeader] cannot hope to keep his throne."
  event_SOV_russian_revolution.8.a: "The Tsar must abdicate!"
  event_SOV_russian_revolution.9.t: "The End of [FROM.GetOldAdjective] Autocracy"
  event_SOV_russian_revolution.9.d: "Three-hundred years of Romanov rule have come to an end in [FROM.GetOldNameDef], ousted by tides of hungry citizens in the capital.\n\nA bread riot in the chilly [FROM.capital.GetCapitalVictoryPointName] morning quickly garnering crowds of disheveled workers, hopeful liberals, and radicals, from all corners of the city: their appetite soon became one for reform, democracy, and an end to the Tsardom. Pouring into the [FROM.capital.RussiaGetSeatOfGovernment], the people of [FROM.GetOldAdjective] handed their mandate to a reluctant ministry with cheers and roars.\n\nIn the commotion, [FROM.GetOldAdjective] soldiers and workers convened in the empty Duma halls to form a council of their own - a Soviet.\n\n[FROM.GetOldNameDef] meets the new day with optimism, but cynical commentators wonder how these rival administrations will coexist."
  event_SOV_russian_revolution.9.a: "[FROM.GetOldNameDefCap] cannot survive without its monarchy!"
  event_SOV_russian_revolution.9.b: "Perhaps it was only a matter of time."
  event_SOV_russian_revolution.9.c: "Trouble is brewing in [FROM.GetOldNameDef]."