l_english:
 gas_regiment: "Gas Regiment"
 gas_regiment_desc: "Infantry deployed to release gas from cannisters, blistering or suffocating the enemy."
 field_artillery_brigade: "Field Artillery Brigade"
 field_artillery_brigade_desc: "Light, direct-fire artillery. Easily transported to follow an offensive, but unable to fire into cover or earthworks."
 field_artillery_gas_brigade: "Field Gas Artillery Brigade"
 field_artillery_gas_brigade_desc: "Field Artillery equipped with gas-shells, able to deliver poisonous gas directly to enemy ranks."
 heavy_artillery_brigade: "Heavy Artillery Brigade"
 heavy_artillery_brigade_desc: "Heavy, indirect-fire artillery. Long-ranged and able to shell into forts and trenches, but cumbersome and expensive."
 heavy_artillery_gas_brigade: "Heavy Gas Artillery Brigade"
 heavy_artillery_gas_brigade_desc: "Heavy Artillery equipped with gas-shells, for raining noxious fumes onto enemy entrenchments and formations."
 siege_artillery_brigade: "Siege Artillery Brigade"
 siege_artillery_brigade_desc: "Monumental guns for launching earth-sundering shells. Slow to position, difficult to supply and maintain."
 category_cavalry: "Cavalry"