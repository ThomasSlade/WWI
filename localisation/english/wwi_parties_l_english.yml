  established_t: "Established"
  established_t_desc: "Established countries are secure in their diplomatic standing, and have the overseas colonies to feed their industry. They seek to uphold the Concert of Europe."
  expansionist_t: "Expansionist"
  expansionist_t_desc: "Expansionist countries have a large industry but lack the global security of §YEstablished§! powers. Feeling their interests are vulnerable, they seek to overturn the Concert of Europe.."
  revolutionary_t: "Radical"
  revolutionary_t_desc: "Radical countries are driven by ideological zeal, and do not conform to the traditional rules of statecraft. Shunned by both §YEstablished§! and §YExpansionist§! countries, they seek to destroy the Concert of Europe."