l_english:
  # Tooltips
  wwi_macedonian_arbitration_austria_tt: "§YAfter defeating [TUR.GetNameDef]: Macedonian states on the [SER.GetNameDef]-[BUL.GetNameDef] border will be awarded to whichever country [AUS.GetNameDef] has the highest opinion of.§!"
  wwi_macedonian_arbitration_russia_tt: "§YAfter defeating [TUR.GetNameDef]: Macedonian states on the [SER.GetNameDef]-[BUL.GetNameDef] border will be awarded to whichever country [SOV.GetNameDef] has the highest opinion of.§!"


  # Montenegro
  wwi_montenegro.1.t: "Serbia Invites Us to Join the Balkan League"
  wwi_montenegro.1.d: "Long have we coveted the Turkish lands on our borders, but our small kingdom could never stand up to the Ottoman Empire, even in its decline.\n\nNow, however, it seems that Serbia wants to make us an offer: they will support our claims, if we join them in the coming wars.\n\nThe Serbs are old friends of ours, but the Turks are not to be underestimated. How should we respond?"
  wwi_montenegro.1.a: "How could we say no?"
  wwi_montenegro.1.b: "[Root.GetName] must stay out of trouble, for now."

  wwi_montenegro.2.t: "[SER.GetNameDefCap] Offers Unification"
  wwi_montenegro.2.d: "In light of the mounting perils of the Balkans, our Serb brethren across the Dinarides have tabled a radical maneuver: our unification with [SER.GetNameDefCap].\n\nWhile the proposal is certainly bombastic, it doesn't arrive without precedent. [ROOT.GetNameDefCap] and [SER.GetNameDefCap] share many centuries of history and language - unification has never been unthinkable to intellectuals in [ROOT.capital.GetCapitalVictoryPointName]. With the world changing so quickly, perhaps it's time to join our voices with [SER.capital.GetCapitalVictoryPointName]."
  wwi_montenegro.2.a: "We accept!"
  wwi_montenegro.2.b: "[ROOT.GetNameDefCap] will only join as an autonomous polity."
  wwi_montenegro.2.c: "No. [ROOT.GetNameDefCap] will remain independent."

  # Romania
  wwi_romania.1.t: "Serbia Offers Territory in Exchange for Mutual Assurances"
  wwi_romania.1.d: "Our Balkan co-inhabitants to the west have come to the [Root.GetAdjective] foreign office, this morning, with a proposal: join their little 'Balkan League', and we'll be granted the province of Branicevo - home to a large Romanian-speaking minority.\n\nSuch an offer hardly caters to the concerns centre-stage of [Root.GetAdjective] posturing, but perhaps an alliance with [From.GetName] would serve us well in our fight against greater foes ..."
  wwi_romania.1.a: "We'll take it!"
  wwi_romania.1.b: "An ill-advised entanglement."

  # Greece
  wwi_greece.1.t: "Britain Encourages Greece to Join Balkan League"
  wwi_greece.1.d: "The British - historic partners of ours - have nonetheless always maintained a conservative stance on the recession of Turkish influence. Until recently, that is. This morning, a telegram from London arrived detailing British approval - insistence, really - of Greek entry into a military alliance with Serbia. Such an alliance would surely aid in our reclamaition of Greek territory, if we could only earn Serbian approval. Britain, in addition, has promised political support in exchange for our compliance."
  wwi_greece.1.a: "Thessaloniki shall be ours again!"
  wwi_greece.1.b: "Throw our lot in with the Serbs? Perhaps not."

  # News
  wwi_news.1.t: "[TUR.GetNameDef] Humiliated in Italo-[TUR.GetAdjective] War"
  wwi_news.1.d: "When war broke out between [ITA.GetNameDef] and the long-attested Sick Man of Europe, there was little wonder of who would emerge victorious. Still, Italy's consistent beating back of its mediterranean foe has left even the most speculative pundits stunned at the military weakness of the ageing empire. Now, as [ITA.GetNameDef] gathers up its winnings, it must be supposed that other [TUR.GetAdjective] neighbors might soon follow the [ITA.GetADjective] example."
  wwi_news.1.a_turkish_ally: "A troubling challenge to our interests."
  wwi_news.1.a_neutral: "[TUR.GetNameDef] is surely on its last legs."
  wwi_news.1.a_turkish_enemy: "This could be our chance!"