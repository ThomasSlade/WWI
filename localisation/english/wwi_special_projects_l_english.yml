l_english:
 sp_land_heavy_tank_prototype: "Experimental Heavy Tank"
 sp_land_heavy_tank_prototype_desc: "The tracks of modern tractors show promise in carrying heavy vehicles across open country. It's been proposed that this design could serve as the basis for a mobile armoured vehicle - something of a warship on land. Such an engine could safely approach enemy defenses, clear barbed wire, and sweep entrenched positions with its armaments. Could this great clumsy beast be the key to 20th century war?"
 sp_land_wheeled_tank_prototype: "Experimental Wheeled Tank"
 sp_land_wheeled_tank_prototype_desc: "The traversal of the unpaved wilderness has already been solved by the large-wheeled carts of Central Asia, and it may yet meet our need for an armoured fighting platform to withstand enemy firepower. It must be said that the design is a conspicuous one, but with applied effort we can surely make this machine service-worthy."
 sp_land_superheavy_siege_artillery: "Superheavy Siege Artillery"
 sp_land_superheavy_siege_artillery_desc: "Modern fortifications remain impervious to the shells of an average howitzer. To bring down the reinforced walls of a polygonal bunker, and to outrange its garrison batteries, a gun of extraordinary calibre is required."