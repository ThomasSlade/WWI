l_english:
  # Serbia
  wwi_serbia.1.t: "Austro-Hungarian Ultimatum"
  wwi_serbia.1.d: "In the wake of the assassination of Archduke Franz Ferdinand by pro-Serb elements, Vienna has offered our foreign office a grave set of demands. The ultimatum insists upon Austrian control of our judicial process, the removal of Serbian officials implicated with the incident, and the cessation of all posturings from Belgrade on Austrian-controlled Serbdom.\n\nNaturally, accepting such conditions would amount to a forfeit of Serbian sovreignty. The Austrians have been quite clear, however, that the only alternative is war."
  wwi_serbia.1.a: "An unmeetable set of demands! We knew nothing of this plot!"
  wwi_serbia.1.b: "We cannot withstand the might of Austria-Hungary ..."
  wwi_serbia.2.t: "[From.GetName] Joins Our League"
  wwi_serbia.2.d: "[From.GetName] has agreed to enter our defensive pact. What could stand in our way now?"
  wwi_serbia.2.a: "We knew they'd come around."
  wwi_serbia.3.t: "[From.GetName] Accepts Our Deal to Join The Balkan League"
  wwi_serbia.3.d_austria: "Longstanding the contention over our rightful Macedonian territory with [From.GetName] may be, it appears that [From.GetNameDef] has found it in themselves to compromise, agreeing that in the event of a war against [TUR.GetNameDef], disputed territory in Macedonia shall be arbitrated by [AUS.GetNameDef].\n\nNo doubt the [From.GetAdjectiveCap] ministry expects they'll be favoured."
  wwi_serbia.3.d_russia: "Longstanding the contention over our rightful Macedonian territory with [From.GetName] may be, it appears that [From.GetNameDef] has found it in themselves to compromise, agreeing that in the event of a war against [TUR.GetNameDef], disputed territory in Macedonia shall be arbitrated by [SOV.GetNameDef].\n\nNo doubt the [From.GetAdjectiveCap] ministry expects they'll be favoured."
  wwi_serbia.3.a: "We'll see about that."
  wwi_serbia.5.t: "[From.GetName] Refuses Ultimatum"
  wwi_serbia.5.d: "[From.GetName], ever insolent, has averted all hope of peace in refusing to recognise Macedonia as a solely [Root.GetAdjectiveCap] territory. The consequence of such a rejection was made quite apparent in our ultimatum."
  wwi_serbia.5.a: "[From.GetName] will abandon their claims one way or another!"
  wwi_serbia.6.t: "[From.GetName] Accepts Ultimatum"
  wwi_serbia.6.d: "For all their tough talk, diplomats in [From.Capital.GetName] have proven yellow-bellied indeed after caving to our demands that they relinquish claims on Macedonia. The region is now ours to take: Bulgarian Macedonians won't see a shred of support from their mother state."
  wwi_serbia.6.a: "Rightfully so."
  wwi_serbia.7.t: "[From.GetName] Asks to Join the Balkan League"
  wwi_serbia.7.d: "[From.GetName] has requested to join our military alliance, no doubt hoping to claim some portion of our inevitable conquests as their own. The [From.GetAdjectiveCap] is hardly impressive; their navy, on the other hand ..."
  wwi_serbia.7.d_bulgaria: "[From.GetName] has requested to join our military alliance, no doubt hoping to claim some portion of our inevitable conquests as their own. This is in spite of [BUL.GetName] already holding a spot within the League; [BUL.GetName] and [GRE.GetName] have overlapping interests in Salonika. Still, that's hardly a concern of ours ..."
  wwi_serbia.7.a: "So long as they promise to play nice."
  wwi_serbia.7.b: "We have little need of [From.GetAdjectiveCap] support."
  wwi_serbia.8.t: "Bosnia Asks to Join [SER.GetName]"
  wwi_serbia.8.d: "After much campaigning, the Narodna Odbrana has paved the road to Bosnian unification with [SER.GetName]. Sarajevo's leadership is firmly at our side, and [FROM.GetNameDef] is sufficiently unstable that a peaceful secession couldn't possibly be met with force.\n\nBosnia is ours. We need only take it."
  wwi_serbia.8.a: "Unification at last!"
  wwi_serbia.8.b: "Not yet. But soon!"
  wwi_serbia.9.t: "[SVO.GetNameDefCap] Proposes Unification"
  wwi_serbia.9.d: "Our countrymen across the Danube feel that their situation now permits ratifying their ultimate objective: unification with [ROOT.GetNameDef]."
  wwi_serbia.9.a: "This is a great day for Serbdom."
  wwi_serbia.9.b: "No! Greater Serbia must be a federated endeavor."
  wwi_serbia.10.t: "The Independent Radicals Seize [125.GetCapitalVictoryPointName]"
  wwi_serbia.10.d: "Powerful and numerous her enemies may be, [SER.GetNameDef] has faltered in the face of foreign posturing for far too long. For this reason we have finally taken the drastic measure of staging a coup in [SER.capital.GetCapitalVictoryPointName]; our columns march proudly through the city's ancient streets and into the skupština, where the moderates - vocal in their reservations in claiming [SER.GetNameDef]'s destiny for so many years - fall silent.\n\nThough [SER.capital.GetCapitalVictoryPointName] greets our ascension with applause, cowards and conciliators waste no time in fleeing, sure to recuperate and raise their illegitimate forces. This is of little concern to us: [SER.GetRulingParty] has the backing of the May Coup Regicides and their broad military endorsement.\n\nAs the true [SER.GetName] prepares for civil war, whispers circulate the cafes of [SER.capital.GetCapitalVictoryPointName]; our coup was a machination of the mysterious Black Hand, they say, and this change of rule makes inevitable their ultimate goal: the reclamation of all Serbdom.\n\nHearsay, of course."
  wwi_serbia.10.a: "Nonetheless, we fight for Greater Serbia."
  wwi_serbia.11.t: "The Independent Radicals Seize [125.GetCapitalVictoryPointName]"
  wwi_serbia.11.d: "Though the regicides of 1903 coup have been a blatantly treasonous bloc for some time, few in [ROOT.GetLeader]'s government would have anticipated a manoeuvre so audacious as igniting a civil war.\n\nYet the May Coup Conspirators - headed by purported leader of the Black Hand, one Dragutin 'Apis' Dimitrijević - march their columns between [125.GetCapitalVictoryPointName]'s graceful townhouses. It's little wonder what the Independent Radicals plan to accomplish once their soldiers flood the skupština: a reckless campaign to reclaim Serbs under foreign rule - at the expense of our standing with the Great Powers.\n\nThis disaster affords us an opportunity: crush the 'Black Hand' and its sinister influence once and for all. With Apis and his hawks removed, we can purge our Bosnian activist network of irresponsible elements - and assassins."
  wwi_serbia.11.a: "Put down these fools before our homeland is undone."
  wwi_serbia.12.t: "[SER.GetAdjectiveCap] State Visit to [FRA.capital.GetCapitalVictoryPointName]"
  wwi_serbia.12.d: "A welcome sense of festivity overcame [FRA.GetAdjectiveCap] and [SER.GetAdjectiveCap] diplomatic circles this week, in appreciation of the [SER.GetAdjectiveCap] King's much-anticipated visit to the Great Power's capital.\n\nKing Petar I, who fought as an exile in the Franco-Prussian war on the side of [FRA.GetOldNameDef], was gifted by [FRA.GetLeader] a golden medal for his service.\n\nThe [FRA.GetAdjectiveCap] statesman later declared Petar 'King of all the Serbs', a title sure to irritate [SER.GetAdjectiveCap] neighbors harbouring separatist minorities."
  wwi_serbia.12.a_serbia: "A generous recognition!"
  wwi_serbia.12.a_france: "We wish his majesty well."
  wwi_serbia.12.a_austria: "How dare they!"

  wwi_serbia.13.t: "Balkan Nations Request our Arbitration"
  wwi_serbia.13.d: "[SER.GetNameDefCap] and [BUL.GetNameDefCap] - recent victors of the Balkan War against [TUR.GetNameDefCap] - have agreed to seek our arbitration in dividing their winnings. Chief among their disagreements are territories within Macedonia.\n\nThough certainly a flattering request, we risk alienating one of the two clients in this dealing, particularly if they choose to ignore our decision ..."
  wwi_serbia.13.a: "[SER.GetNameDefCap] has always been our favourite."
  wwi_serbia.13.b: "The land is rightly [BUL.GetAdjective]."
  wwi_serbia.14.t: "[FROM.GetNameDefCap] Favours Us in Macedonian Arbitration"
  wwi_serbia.14.d_serbia: "In accordance to our agreement with [BUL.GetNameDef] to seek [FROM.GetAdjective] arbitration in Macedonia, it seems we're in the Foreign Power's good graces. Disputed borderlands in the region, until now occupied by [BUL.GetNameDef], have been awarded to us.\n\nThough certainly a just ruling, it's unclear how our [BUL.GetAdjective] 'allies' will react to the news ..."
  wwi_serbia.14.d_bulgaria: "In accordance to our agreement with [SER.GetNameDef] to seek [FROM.GetAdjective] arbitration in Macedonia, it seems we're in the Foreign Power's good graces. Disputed borderlands in the region, until now occupied by [SER.GetNameDef], have been awarded to us.\n\nThough certainly a just ruling, it's unclear how our [SER.GetAdjective] 'allies' will react to the news ..."
  wwi_serbia.14.a: "The territory is ours, fair and square."
  wwi_serbia.15.t: "[FROM.GetNameDefCap] Rules Against Us in Macedonian Arbitration"
  wwi_serbia.15.d_bulgaria: "Though we agreed to [FROM.GetAdjective] arbitration in the event of victory in Macedonia, we did so under the presumption that they'd take our side!\n\nIt seems our trust was misplaced: borderlands of our hard-won Macedonian territory have been giften to the dastardly Serbs.\n\nIgnoring this snubbery risks angering [FROM.GetNameDef], but it's evident that they're evidently no friends of ours ..."
  wwi_serbia.15.d_serbia: "Though we agreed to [FROM.GetAdjective] arbitration in the event of victory in Macedonia, we did so under the presumption that they'd take our side!\n\nIt seems our trust was misplaced: borderlands of our hard-won Macedonian territory have been giften to the dastardly Bulgars.\n\nIgnoring this snubbery risks angering [FROM.GetNameDef], but it's evident that they're evidently no friends of ours ..."
  wwi_serbia.15.a: "We won the First Balkan War. We can win a Second!"
  wwi_serbia.15.b: "Let it be. The [FROM.GetAdjective] say is final."