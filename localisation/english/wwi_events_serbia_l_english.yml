l_english:
  # Serbia
  wwi_serbia.1.t: "Austro-Hungarian Ultimatum"
  wwi_serbia.1.d: "In the wake of the assassination of Archduke Franz Ferdinand by pro-Serb elements, Vienna has offered our foreign office a grave set of demands. The ultimatum insists upon Austrian control of our judicial process, the removal of Serbian officials implicated with the incident, and the cessation of all posturings from Belgrade on Austrian-controlled Serbdom.\n\nNaturally, accepting such conditions would amount to a forfeit of Serbian sovreignty. The Austrians have been quite clear, however, that the only alternative is war."
  wwi_serbia.1.a: "An unmeetable set of demands! We knew nothing of this plot!"
  wwi_serbia.1.b: "We cannot withstand the might of Austria-Hungary ..."
  wwi_serbia.2.t: "[From.GetName] Joins Our League"
  wwi_serbia.2.d: "[From.GetName] has agreed to enter our defensive pact. What could stand in our way now?"
  wwi_serbia.2.a: "We knew they'd come around."
  wwi_serbia.5.t: "[From.GetName] Refuses Ultimatum"
  wwi_serbia.5.d: "[From.GetName], ever insolent, has averted all hope of peace in refusing to recognise Macedonia as a solely [Root.GetAdjectiveCap] territory. The consequence of such a rejection was made quite apparent in our ultimatum."
  wwi_serbia.5.a: "[From.GetName] will abandon their claims one way or another!"
  wwi_serbia.6.t: "[From.GetName] Accepts Ultimatum"
  wwi_serbia.6.d: "For all their tough talk, diplomats in [From.Capital.GetName] have proven yellow-bellied indeed after caving to our demands that they relinquish claims on Macedonia. The region is now ours to take: Bulgarian Macedonians won't see a shred of support from their mother state."
  wwi_serbia.6.a: "Rightfully so."
  wwi_serbia.7.t: "[From.GetName] Asks to Join the Balkan League"
  wwi_serbia.7.d: "[From.GetName] has requested to join our military alliance, no doubt hoping to claim some portion of our inevitable conquests as their own. The [From.GetAdjectiveCap] is hardly impressive; their navy, on the other hand ..."
  wwi_serbia.7.d_bulgaria: "[From.GetName] has requested to join our military alliance, no doubt hoping to claim some portion of our inevitable conquests as their own. This is in spite of [BUL.GetName] already holding a spot within the League; [BUL.GetName] and [GRE.GetName] have overlapping interests in Salonika. Still, that's hardly a concern of ours ..."
  wwi_serbia.7.a: "So long as they abide our interests."
  wwi_serbia.7.b: "We have little need of [From.GetAdjectiveCap] support."
  wwi_serbia.8.t: "Bosnia Asks to Join [SER.GetName]"
  wwi_serbia.8.d: "After much campaigning, the Narodna Odbrana has paved the road to Bosnian unification with [SER.GetName]. Sarajevo's leadership is firmly at our side, and [FROM.GetNameDef] is sufficiently unstable that a peaceful secession couldn't possibly be met with force.\n\nBosnia is ours. We need only take it."
  wwi_serbia.8.a: "Unification at last!"
  wwi_serbia.8.b: "Not yet. But soon!"
  wwi_serbia.9.t: "[SVO.GetNameDefCap] Proposes Unification"
  wwi_serbia.9.d: "Our countrymen across the Danube feel that their situation now permits ratifying their ultimate objective: unification with [ROOT.GetNameDef]."
  wwi_serbia.9.a: "This is a great day for Serbdom."
  wwi_serbia.9.b: "No! Greater Serbia must be a federated endeavor."
  wwi_serbia.10.t: "The Black Hand Seizes [125.GetCapitalVictoryPointName]"
  wwi_serbia.10.d: "[SER.GetNameDefCap] has faltered in the face of her enemies for too long. We have taken the drastic measure of staging a coup in [SER.capital.GetCapitalVictoryPointName]; our columns march proudly through the streets and into the skupština, where the moderates fall silent.\n\nThough [SER.capital.GetCapitalVictoryPointName] greets us with applause, cowards and conciliators waste no time in fleeing to establish an illigitemate government.\n\nAs the true [SER.GetOldName] prepares for civil war, whispers circulate the cafes of [SER.capital.GetCapitalVictoryPointName]; our coup was a machination of the mysterious Black Hand, they claim.\n\nHearsay, of course."
  wwi_serbia.10.a: "Nonetheless, we fight for Greater Serbia."
  wwi_serbia.11.t: "The Independent Radicals Seize [125.GetCapitalVictoryPointName]"
  wwi_serbia.11.d: "Though the regicides of 1903 coup have been a blatantly treasonous bloc for some time, few in [ROOT.GetLeader]'s government would have anticipated a manoeuvre so audacious as igniting a civil war.\n\nYet the May Coup Conspirators - headed by purported leader of the Black Hand, one Dragutin 'Apis' Dimitrijević - march their columns between [125.GetCapitalVictoryPointName]'s graceful townhouses. It's little wonder what the Independent Radicals plan to accomplish once their soldiers flood the skupština: a reckless campaign to reclaim Serbs under foreign rule - at the expense of our standing with the Great Powers.\n\nThis disaster affords us an opportunity: crush the 'Black Hand' and its sinister influence once and for all. With Apis and his hawks removed, we can purge our Bosnian activist network of irresponsible elements - and assassins."
  wwi_serbia.11.a: "Put down these fools before our homeland is undone."
  wwi_serbia.12.t: "[SER.GetAdjectiveCap] State Visit to [FRA.capital.GetCapitalVictoryPointName]"
  wwi_serbia.12.d: "A welcome sense of festivity overcame [FRA.GetAdjective] and [SER.GetAdjective] observers this week, in appreciation of the [SER.GetAdjectiveCap] King's much-anticipated visit to [FRA.capital.GetCapitalVictoryPointName].\n\nKing Petar I, who - as an exile - fought for the [FRA.GetAdjective] in the Franco-Prussian war, was gifted by [FRA.GetLeader] a golden medal for his service.\n\nThe [FRA.GetAdjectiveCap] statesman later declared Petar 'King of all the Serbs', much to the chagrin of [SER.GetAdjectiveCap] neighbors harbouring separatist minorities."
  wwi_serbia.12.a_serbia: "A generous recognition!"
  wwi_serbia.12.a_france: "We wish his majesty well."
  wwi_serbia.12.a_austria: "How dare they!"

  wwi_serbia.17.t: "[FROM.GetNameDefCap] Hands Over [?ROOT.serbia_requested_port.GetName]"
  wwi_serbia.17.d: "[FROM.GetNameDefCap] has agreed to grant us the port of [?ROOT.serbia_requested_port.GetName] in exchange for economic concessions."
  wwi_serbia.17.a: "The seas are ours!"
  wwi_serbia.18.t: "[FROM.GetNameDefCap] Declines [?ROOT.serbia_requested_port.GetName] Treaty Port"
  wwi_serbia.18.d: "Unfortunately, [FROM.GetNameDef] has denied us control of [?ROOT.serbia_requested_port.GetName].\n\nPerhaps their interest in keeping us landlocked is more stubborn than we'd hoped."
  wwi_serbia.18.a: "Disappointing"
  wwi_serbia.19.t: "Further Negotiations of Bosnia"
  wwi_serbia.19.d: "With relations to [AUS.GetNameDef] growing closer, our government believes that [ROOT.GetNameDef] is in a position to request greater control of Bosnian territory, in exchange for significant integration into the [ROOT.GetAdjectiveCap] economy.\n\nBut which territory should we request?"
  wwi_serbia.19.a: "[169.GetName]"
  wwi_serbia.19.b: "[146.GetName]"
  wwi_serbia.19.c: "Perhaps we shouldn't embarrass ourselves ..."
  wwi_serbia.19.t_second: "[FROM.GetNameDefCap] Denies Additional Bosnian Territory"
  wwi_serbia.19.d_second: "[FROM.GetNameDefCap] has made it clear to our envoy that ceding [requested_bosnia_province.GetName] to us would not be in their interest."
  wwi_serbia.19.a_second: "Perhaps [169.GetName] instead?"
  wwi_serbia.19.b_second: "Perhaps [146.GetName] instead?"
  wwi_serbia.19.c_second: "Regrettable"
  wwi_serbia.20.t: "[FROM.GetNameDefCap] Agrees to Give Us [requested_bosnia_province.GetName]"
  wwi_serbia.20.d: "A greater share of Serbdom is ours, albeit at the cost of a worrisome blow to our economic independence.\n\nCould such a transaction really be worthwhile?"
  wwi_serbia.20.a: "We will make it worthwhile."
  wwi_serbia.21.t: "[FROM.GetAdjectiveCap] Plot to Assassinate [ROOT.GetLeader]"
  wwi_serbia.21.d: "Security officials have warned us of a plot to murder our leader, [ROOT.GetLeader], orchestrated by the [FROM.GetAdjectiveCap] government.\n\nThough we cannot be sure, we suspect this vile attack will take place when [ROOT.GetLeader] next tours the capital, a visit intended to improve [ROOT.GetLeader.GetHerHis] standing with the public.\n\nWith adequate resources we can ensure the safety of [ROOT.GetLeader]. Or, we could cancel the tour."
  wwi_serbia.21.a: "Something must be done."
  wwi_serbia.22.t: "Assassination of [FROM.GetAdjectiveCap] Leader Failed: Tour Cancelled"
  wwi_serbia.22.d: "Our plot to assassinate [FROM.GetLeader] was unsucessful.\n\n[FROM.GetAdjectiveCap] officials, evidently aware of the threat, opted to cancel [FROM.GetLeader]'s planned tour of the capital at the last moment, thwarting our opportunity to strike.\n\nThe evasion does not come freely to [FROM.GetNameDefCap]: the tour's cancellation has been met with criticism from [FROM.GetAdjectiveCap] citizens, who cannot help but see their government as weak."
  wwi_serbia.22.a: "Next time ..."
  wwi_serbia.23.t: "Assassination of [FROM.GetAdjectiveCap] Leader Failed: Heightened Security"
  wwi_serbia.23.d: "Our plot to assassinate [FROM.GetLeader] was unsucessful.\n\n[FROM.GetAdjectiveCap] officials, evidently aware of the threat, were willing to deploy a ludicrous quantity of security to supervise the tour.\n\nThough the plot has failed, our advisors suspect it has cost [FROM.GetNameDefCap] in both manpower and equipment."
  wwi_serbia.23.a: "Next time ..."
  wwi_serbia.24.t: "[FROM.GetOldAdjectiveCap] Leader Assassinated"
  wwi_serbia.24.d: "[?FROM.SER_assassination_target_leader.GetName] met [?FROM.SER_assassination_target_leader.GetHerHis] fate today at the hands of our skilled assassins.\n\nThe [FROM.GetAdjectiveCap] head of state was so blithely touring [?FROM.SER_assassination_target_leader.GetHerHis] capital's streets when one of our men tossed a bomb from a rooftop. Though a narrow miss, a second assailant closed in on the hapless official to finish the job with a revolver. Both agents took their cyanide pills before they could be interrogated.\n\nWhile [FROM.GetNameDef] blames us, they cannot prove our responsibility of the killing. They can only tremble at the inescapable grasp of the Black Hand."
  wwi_serbia.24.a: "Another obstacle to Serbdom, dead."
  wwi_serbia.25.t: "[?FROM.SER_assassination_target_leader.GetName] Assassinated by [SER.GetOldNameDefCap]"
  wwi_serbia.25.d: "Tragedy grips [ROOT.GetNameDef] as news of [?FROM.SER_assassination_target_leader.GetName]'s murder sweeps the public.\n\nThe nation's leader, during a visit to [ROOT.Capital.GetCapitalVictoryPointName], narrowly survived one [SER.GetAdjectiveCap] assassin before taking a bullet from a second accomplice. Before anything could be done, [?FROM.SER_assassination_target_leader.GetSheHe] had bled out onto the pavement of [?FROM.SER_assassination_target_leader.GetHerHis] capital.\n\nThough the assailants were able to take cyanide before we could capture them, the involvement of [SER.GetNameDef] is an open secret. Nonetheless, lacking evidence, we are unable to retaliate."
  wwi_serbia.25.a: "They will pay for this."
  wwi_serbia.26.t: "[FROM.GetAdjectiveCap] Leader Assassinated, [SER.GetOldNameDefCap] Blamed"
  wwi_serbia.26.d: "[?FROM.SER_assassination_target_leader.GetName] was shot while touring the streets of [FROM.Capital.GetCapitalVictoryPointName] today, in what [FROM.GetAdjective] officials are claiming to be a [SER.GetAdjective] assassination.\n\n[SER.GetNameDefCap] has a notorious history of regicidal intrigue, having murdered its own king in 1903 - the perpetrators of which have since allegedly organised into a nationalist network named the 'Black Hand'.\n\nDespite [FROM.GetAdjective] claims, [SER.GetNameDefCap] denies any involvement, and without further evidence even [FROM.GetAdjective] allies are unlikely to take action."
  wwi_serbia.26.a: "A tragedy."
  wwi_serbia.26.b: "Who can say what happened?"
  wwi_serbia.27.t: "[FROM.GetOldNameDefCap] Moves to Fill [ROOT.GetOldAdjectiveCap] Power Vacuum"
  wwi_serbia.27.d: "In the wake of the assassination of [?ROOT.SER_assassination_target_leader.GetName], the [FROM.GetAdjectiveCap] government has publicly announced its intentions to secure its 'regional interests' in our country. Demanding nothing less than the installation of a [FROM.Capital.GetCapitalVictoryPointName]-friendly government for the forseeable future.\n\nWith the political landscape still in turmoil, [ROOT.GetNameDef] is ill-prepared to resist what amounts to an annexation."
  wwi_serbia.27.a: "What choice do we have?"
  wwi_serbia.27.b: "We refuse."
  wwi_serbia.lausanne_report_body: "The [SWI.GetOldAdjective]-lead Lausanne report paints a grim picture of the reality in [FROM.GetOldName], citing mass graves, the burning of civilians inside their homes, and mutilations.\n\n"
  wwi_serbia.28.t: "[FROM.GetOldNameDefCap] Reports Abuses in Lausanne Report"
  wwi_serbia.28.d: "[FROM.GetNameDefCap] has made an appeal to our government, alleging ghastly brutality against [FROM.GetAdjective] citizens in occupied territory, and imploring our intervention.\n\n$wwi_serbia.lausanne_report_body$The chilling document, though not wholly verified, is bound to win [FROM.GetAdjective] support among our policy makers."
  wwi_serbia.28.a: "Horrific."
  wwi_serbia.29.t: "[FROM.GetOldNameDefCap] Appeals to [swayed_by_lausanne_investigation.GetOldNameDefCap] in Lausanne Report"
  wwi_serbia.29.d: "[FROM.GetNameDefCap] has made an appeal to [swayed_by_lausanne_investigation.GetNameDefCap], decrying the 'bloodthirsty conduct' of our forces in occupied [FROM.GetOldNameCap].\n\n$wwi_serbia.lausanne_report_body$The chilling document, though certainly a [FROM.GetAdjective] propoganda ploy, is bound to sway the [FROM.GetAdjective] press."
  wwi_serbia.29.a: "Wild conjecture."
  wwi_serbia.30.t: "[FROM.GetOldNameDefCap] Bombards [208.GetName] Ports From [164.GetName] Heights"
  wwi_serbia.30.d: "Our shipyards in [208.GetName] have been devastated by [FROM.GetAdjectiveCap] artillery in the neighboring highlands.\n\nThe Lovćen heights, a point of anxiety for [ROOT.GetAdjectiveCap] strategists even before the war, looms over our naval presence in [208.GetCapitalVictoryPointName]: only by dislodging [FROM.GetNameDef] from the heights can we prevent these assaults."
  wwi_serbia.30.a: "We must push them back!"
  wwi_events_SER_balkan_arbitration.1.t: "[?global.balkan_arbitrator.GetName] Now Favours Us in Balkan Matters"
  wwi_events_SER_balkan_arbitration.1.d: "Our agreement to defer to [?global.balkan_arbitrator.GetNameDef] in Balkan territorial settlements has come to fruition: [?global.balkan_arbitrator.GetNameDef] now favours us over [?balkan_arbitration_opponent.GetNameDef]."
  wwi_events_SER_balkan_arbitration.1.a: "And why wouldn't they?"
  wwi_events_SER_balkan_arbitration.2.t: "[?global.balkan_arbitrator.GetName] Favours [?balkan_arbitration_opponent.GetName] Over Us in Balkan Matters"
  wwi_events_SER_balkan_arbitration.2.d: "A warming of [?balkan_arbitration_opponent.GetAdjective]-[?global.balkan_arbitrator.GetAdjective] relations has undone what support we could expect from [?balkan_arbitration_opponent.GetNameDef]: the Great Power will no longer arbitrate in our favour should a Balkan War break out."
  wwi_events_SER_balkan_arbitration.2.a: "We must endeavor to win them back."
  wwi_events_SER_balkan_arbitration.3.t: "Balkan Arbitration Against [BUL.GetName]"
  wwi_events_SER_balkan_arbitration.3.d: "Our inability to win [BUL.GetAdjective] cooperation in a coming Balkan conflict could be resolved with the selection of a 'neutral' arbitrator.\n\nSuch a Power, were we to remain in their good graces, would rule in our favour during the peace settlement of a Balkan War.\n\nTo which power should we appeal?"
  wwi_events_SER_balkan_arbitration.3.a: "[SOV.GetNameDefCap]"
  wwi_events_SER_balkan_arbitration.3.b: "[AUS.GetNameDefCap]"
  wwi_events_SER_balkan_arbitration.4.t: "[FROM.GetName] Requests [THIS.GetAdjective] Alliance, Under [?global.balkan_arbitrator.GetAdjective] Arbitration"
  wwi_events_SER_balkan_arbitration.4.d: "[FROM.GetNameDefCap] has been our rival in Macedonia for quite some time. Yet a telegram from [SER.capital.GetCapitalVictoryPointName] today proposes that we cease our scrapping to take on yet greater perils in the Balkans.\n\nAny disputes over the spoils of conquest will be arbitrated by [?global.balkan_arbitrator.GetNameDef].\n\nShould our bitter history with [SER.GetNameDef] be set aside?"
  wwi_events_SER_balkan_arbitration.4.a: "[SER.GetNameDefCap] would make a valuable ally ..."
  wwi_events_SER_balkan_arbitration.4.b: "Macedonia is not up for negotiation."