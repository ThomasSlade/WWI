l_english:
 LOADING_TIP_0: "M. Sazonov is a sad wobbler.\n- Robert Vansittart, British Diplomat"
 LOADING_TIP_1: "You are not Bulgarian. Fuck your father.\n- Prince Alexander of Serbia"
 LOADING_TIP_2: "I have only one Thessaloniki, which I have already surrendered.\n- Tahsin Pasha, Turkish Commander"
 LOADING_TIP_3: "There is nothing inevitable in this world.\n- Jules Cambon, French Diplomat"
 LOADING_TIP_4: "If we lose the confidence of public opinion in our foreign policy, then all is lost.\n- Tsar Alexander III"
 LOADING_TIP_5: "The Foreign Office? Why, I am the Foreign Office!\n- Kaiser Wilhelm II"
 LOADING_TIP_6: "We are supposed to be pursuing Weltpolitik. If only I knew what that was supposed to be.\n- Alfred von Waldersee, German Field Marshall"
 LOADING_TIP_7: "A navy has no wheels.\n- Kaiser Wilhelm II"
 LOADING_TIP_8: "I'd instantly go out and shoot the Germans, but the Serbs, with them I'd wait and think about it.\n- a Moravian citizen of Austria-Hungary"
 LOADING_TIP_9: "I know no parties anymore, I know only Germans.\n- Kaiser Wilhelm II"
 LOADING_TIP_10: "The Russians are bad. The Germans are bad. But the Honvéd soldiers are the worst beasts.\n- Galician Peasant"
 LOADING_TIP_11: "Are limbs, so dear-achieved, are sides\nFull-nerved, still warm, too hard to stir?\n- Futility, Wilfred Owen"
 LOADING_TIP_12: "There is no balance of power in Europe but me ... me and my twenty-five army corps.\n- Kaiser Wilhelm II"
 LOADING_TIP_13: "Where a Serb dwells, there is Serbia.\n- Ilija Garašanin"
 LOADING_TIP_14: "We are marching against the Russians and we do not know why.\n- Flag of the Czech 8th and 28th Regiments"
 LOADING_TIP_15: "Better to arrest a hundred people too many than one person too few.\n- Conrad von Hötzendorf"
 LOADING_TIP_16: "That blind and imbecile attachment to the most visible of all colors was to have cruel consequences.\n- Adolphe Messimy"
 LOADING_TIP_17: "The lamps are going out all over Europe. We shall not see them lit again in our lifetime.\n- Edward Grey"
 LOADING_TIP_18: "Are we going to unleash a World War, because Izvolsky is still furious over Aerenthal's deception on the Bosnian affair?\n- Jean Juarès"
 LOADING_TIP_19: "This is not a time when any nation can safely strike sparks.\n- Edward Grey"
 LOADING_TIP_20: "Too bad these little people are not my ally.\n- Kaiser Wilhelm II on Serbia"
 LOADING_TIP_21: "Policy, it is I who make it. My policy is a policy of peace.\n- Emperor Franz Joseph I"
 LOADING_TIP_22: "A flourishing and independent Serbia suits our intentions better than the posession of an unruly province.\n- Count Gustav Kálnoky, Austro-Hungarian Foreign Minister"
 LOADING_TIP_23: "A nation of seventy million people suffers, but it does not die.\n- Matthias Erzberger, on the harshness of Germany's armistice terms"
 LOADING_TIP_24: "Your guards are seven feet tall. But when we open our dikes, the water is ten feet deep.\n- Wilhelmina of the Netherlands to Kaiser Wilhelm II"
 LOADING_TIP_25: "Well, what do you know, that IS a firm note after all.\n- Kaiser Wilhelm II after reading the Austrian Ultimatum"
 LOADING_TIP_26: "If Austria is starving, they shouldn't fight a war.\n- Béla Serényi, Hungarian Minister of Agriculture"
 LOADING_TIP_27: "And over Russia I see a quiet\nFar-spreading fire consume all.\n- On Kulikovo Field, Alexander Blok"
 LOADING_TIP_28: "Fear God and Dread Nought.\n- personal motto of Jackie Fisher"
 LOADING_TIP_29: "The humanizing of war? You might as well talk about humanizing Hell.\n- Jackie Fisher"
 LOADING_TIP_30: "I am nibbling away at them.\n- Joseph Joffre"
 LOADING_TIP_31: "Not the machine wins the war, but war is won with machines.\n- Ernst Jünger"
 LOADING_TIP_32: "The artillery conquers. The infantry occupies.\n- Philippe Pétain"
 LOADING_TIP_33: "Courage! We shall get them.\n- Philippe Pétain"
 LOADING_TIP_34: "I will not be responsible for a monstrous slaughter.\n- Tsar Nicholas II"
 LOADING_TIP_35: "If the fight offers itself, we dare not flinch.\n- Gottlieb von Jagow, German Diplomat"
 LOADING_TIP_36: "We are all Africans here.\n- Paul von Lettow-Vorbeck"