 LOADING_TIP_0:0 "M. Sazonov is a sad wobbler.\n- Robert Vansittart, British Diplomat"
 LOADING_TIP_1:0 "You are not Bulgarian. Fuck your father.\n- Prince Alexander of Serbia"
 LOADING_TIP_2:0 "I have only one Thessaloniki, which I have already surrendered.\n- Tahsin Pasha, Turkish Commander"
 LOADING_TIP_3:0 "There is nothing inevitable in this world.\n- Jules Cambon, French Diplomat"
 LOADING_TIP_4:0 "If we lose the confidence of public opinion in our foreign policy, then all is lost.\n- Tsar Alexander III"
 LOADING_TIP_5:0 "The Foreign Office? Why, I am the Foreign Office!\n- Kaiser Wilhelm II"
 LOADING_TIP_6:0 "We are supposed to be pursuing Weltpolitik. If only I knew what that was supposed to be.\n- Alfred von Waldersee, German Field Marshall"
 LOADING_TIP_7:0 "A navy has no wheels.\n- Kaiser Wilhelm II"
 LOADING_TIP_8:0 "I'd instantly go out and shoot the Germans, but the Serbs, with them I'd wait and think about it.\n- a Moravian citizen of Austria-Hungary"
 LOADING_TIP_9:0 "I know no parties anymore, I know only Germans."\n- Kaiser Wilhelm II"
 LOADING_TIP_10:0 "The Russians are bad. The Germans are bad. But the Honvéd soldiers are the worst beasts.\n- a Galician Peasant"
 LOADING_TIP_11:0 "Are limbs, so dear-achieved, are sides\nFull-nerved, still warm, too hard to stir?\n- Futility, Wilfred Owen"
 LOADING_TIP_12:0 "There is no balance of power in Europe but me ... me and my twenty-five army corps."