l_english:
    # Austria
  wwi_austria.1.t: "The Assassination of Franz Ferdinand"
  wwi_austria.1.d: "Franz Ferdinand, heir to the throne of Austria-Hungary, is dead.\n\nIt was an otherwise tranquil day in Sarajevo when, during his state visit to the recently annexed territory of Bosnia-Herzegovina, the Archduke narrowly escaped a bomb thrown into the route of his motorcade. Despite this attempt on his life, Franz opted to continue his tour through the Bosnian city, only to be shot on his return from the town hall by an undetected agent. He and his wife, also victim to the incident, leave three orphaned children.\n\nAs the empire settles into mourning, many in the Austrian government set their glare on Serbia - presumed, by some, to be directly implicated in the murder, which was carried out by members of the mysterious Serb-nationalist Black Hand group. It remains to be seen how the Monarchy will respond to what is only the latest and most audacious of Balkan crises."
  wwi_austria.1.a: "Send an ultimatum! Either the Serbs cooperate, or we march on Belgrade!"
  wwi_austria.1.b: "Despite such a tragedy we must maintain our patience with the Serbs ..."
  wwi_austria.2.t: "Archduke's Visit to Sarajevo a Success"
  wwi_austria.2.d: "Considering the crowds of jubilant Bosnians, it would seem that the royal visit to Bosnia-Herzegovina by Archduke Franz Ferdinand - heir to the Austro-Hungarian throne - could only be called a rousing success. The Archduke and his wife toured the recently annexed territory following renewed attempts to earn the loyalty of their south-slav subjects, amid ongoing talk of reform to the multi-ethnic empire.\n\nDespite moderate warnings of a potential terrorist attack in the region - long coveted by Serb nationalists as a gemstone of south-slav unity - the Archduke's visit proceeded in safety and comfort. He and his Duchess were particularly flattered by the territory's vibrant bazaars and hospitable locals."
  wwi_austria.2.a: "Perhaps Bosnia has a prosperous future in the empire after all."
  wwi_austria.3.t: "Serbia Rejects our Ultimatum"
  wwi_austria.3.d: "In keeping with their tradition of diplomatic intransigence, the Serbian government has rejected our calls for judicial collaboration and an end to Serb expansionism. Grim as this eventuality may be, we made the alternative quite clear to [SER.GetLeader]."
  wwi_austria.3.a: "War it is."
  wwi_austria.4.t: "Serbia Accepts our Ultimatum"
  wwi_austria.4.d: "Despite the assumptions of the Austrian foreign office, the Serbian government, it seems, has come to its senses. We recieved word this morning that [SER.GetLeader]'s administration is willing to give us free reign of investigations into the murder of our beloved Archduke and - more importantly - will revoke claims over our rightful Bosnian holdings. Justice may yet be served to the perpetrators of this brutality. For now, at least, war is no longer a necessity."
  wwi_austria.4.a: "Oh, umm ... splendid."
  wwi_austria.5.t: "Serb Nationalist Cells in Bosnia"
  wwi_austria.5.d: "Indignant for many years over [Root.GetName]'s' recent annexation of Bosnia, Serbs on either side of the Drina have come to form a network of national activists called the Narodna Odbrana, or 'National Defense'.\n\nThe network's official aims are to protect Serbian culture and, ultimately, seek unification with [SER.GetName]. But links are recognised between the highest ranking agents of Narodna Odbrana and the more sinister Black Hand - the intentions of which are suspected to involve terrorism against the Monarchy."
  wwi_austria.5.a: "We must tread carefully in Sarajevo"
  black_hand_and_narodna_odbrana_tt: "§YGain the following National Spirits:\nBosnian Serb Activists:§ §RStability lower than 50% will result in [224.GetName], [146.GetName], and [169.GetName] seceeding to [SER.GetName].§ \n§YBlack Hand Cells:§ §R'Imperial Visit to Bosnia' focus: Delegate will be assassinated.§"
  wwi_austria.6.t: "[SER.GetName] Agitates the Vojvodina Serb Nationalists"
  wwi_austria.6.d: "Rightful lands of Saint Stephen for centuries, the Vojvodina and its majority of Serbs once flirted with separatism in the great revolutions of 1848. Support from independent [SER.GetName] for this treason was duly restrained in this time, yet the arrogance of today's [SER.capital.GetCapitalVictoryPointName] has seen a return to this blithe nonsense. Arms once again flow from [SER.GetName] to Vojvodina, and the separatists are surely primed to stike at our next weakness."
  wwi_austria.6.a: "Outrageous"
  vojvodina_separatists_tt: "§YGain the following National Spirits:\nVojvodina Separatists:§ §RStability lower than 50% will result in [224.GetName] and [171.GetName] seceeding to [SER.GetName].§"
  wwi_austria.8.t: "Bosnia Seceeds"
  wwi_austria.8.d: "Serb activists in Bosnia, known to us for some time but stubborn to our dissuasions, have today made public their declaration of independence from [This.GetNameDef] and subsequent union with [SER.GetName]. Though clearly treasonous, this move has broad legitimacy with diplomatic circles and, in any case, [This.GetNameDef] is frankly too occupied with other crises to forcefully oppose it.\n\nHow could we let this happen?"
  wwi_austria.8.a: "For now, at least, this isn't worth our time ..."
  wwi_austria.9.t: "[SVO.GetNameDefCap] Revolts"
  wwi_austria.9.d.base: "The Serb majority of our southernmost Hungarian lands have risen up in armed revolt!\n\n[SVO.GetNameDefCap] once challenged the Empire, during the 1848 revolutions. Now, they fly their flags once again, seeking to unify with [SER.GetNameDef] - no doubt the prime mover of this treachery."
  wwi_austria.9.d.a: "$wwi_austria.9.d.base$\n\nThe rebels march with what weapons they can scrounge, but it appears that armaments from [SER.GetNameDef] haven't been forthcoming."
  wwi_austria.9.d.b: "$wwi_austria.9.d.base$\n\nThe rebels are adequately armed and manned. [SER.GetNameDefCap] has wasted no time in smuggling ordnance across the Danube."
  wwi_austria.9.d.c: "$wwi_austria.9.d.base$\n\nThe rebels are armed to the teeth, and concerningly numerous. [SER.GetNameDefCap] has spared no expense in arming its lapdog."
  wwi_austria.9.a: "Put down this rabble as was done fifty years ago!"
  wwi_austria.9.b: "[ROOT.GetNameDef] cannot handle another crisis."
  wwi_austria.10.t: "[SER.GetNameDef] Seeks Partition of Bosnia"
  wwi_austria.10.d: "In a surprising change of tact, the [SER.GetName] government has come to us with an offer: if we grant them [224.GetName] as compensation, they will abandon designs on the rest of our south-slav territory.\n\nSuch an exchange would obstruct our expansion into the rest of the Balkans. To remedy this, [SER.GetNameDef] has openly suggested we occupy [MNT.GetNameDef]. Despite the historic friendship between the two nations, it seems [SER.capital.GetCapitalVictoryPointName] is willing to look the other way ..."
  wwi_austria.10.a: "A pile of rocks in exchange for [SER.GetAdjective] compliance? Splendid!"
  wwi_austria.10.b: "The Serbs demanding compensation, whatever next ..."
  wwi_austria.11.t: "[SER.GetNameDef] Seeks Rapproachment"
  wwi_austria.11.d: "Recent diplomatic efforts from [SER.GetNameDef] have made it clear that, after their brief flirtation with [RUS.GetOldNameDef], our troublesome Balkan neighbour is ready to return to our orbit.\n\nRelations with the [SER.GetAdjective] government were once fruitful, but a decade of friction has left many in [AUS.capital.GetCapitalVictoryPointName] fretful. Nonetheless, perhaps we still have an ally south of the Danube?"
  wwi_austria.11.a: "Back with their tails between their legs ..."

